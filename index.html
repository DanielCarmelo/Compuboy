function dibujarDataPlant(e) {
  const cx = e.x + e.w / 2;
  const baseY = e.y + e.h;
  const sway = Math.sin(tiempo * 2 + e.x0) * 3;
  const abre = e.lunge;
  const HX = cx + sway * 0.4;
  const HC = e.headY + 13;

  ctx.strokeStyle = '#2fae4f';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(cx, baseY);
  ctx.quadraticCurveTo(cx + sway, (baseY + HC) / 2, HX, HC + 8);
  ctx.stroke();

  ctx.fillStyle = '#2fae4f';
  for (const lado of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(cx + lado * 13, baseY - 3, 12, 4, lado * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  if (abre > 0.05) {
    ctx.fillStyle = '#7a1030';
    ctx.beginPath();
    ctx.ellipse(HX, HC, 12, 4 + abre * 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  glowOn('#39ff14', 7);
  for (const lado of [-1, 1]) {
    ctx.save();
    ctx.translate(HX, HC);
    ctx.rotate(lado * abre * 0.5);
    ctx.fillStyle = lado < 0 ? '#35c25a' : '#27964a';
    ctx.beginPath();
    ctx.ellipse(0, lado * 6, 17, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#eaffea';
    const bY = lado < 0 ? 3 : -3, tY = lado < 0 ? 8 : -8;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 9 - 3.5, bY); ctx.lineTo(i * 9 + 3.5, bY); ctx.lineTo(i * 9, tY);
      ctx.closePath(); ctx.fill();
    }
    if (lado < 0) {
      ctx.fillStyle = '#ff2fd6';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 6 - 3, -12); ctx.lineTo(i * 6 + 3, -12); ctx.lineTo(i * 6, -18);
        ctx.closePath(); ctx.fill();
      }
      glowOn('#ff3860', 7);
      ctx.fillStyle = '#ff3860';
      ctx.beginPath(); ctx.arc(8, -5, 3.2, 0, Math.PI * 2); ctx.fill();
      glowOff();
    }
    ctx.restore();
  }
  glowOff();
}

function dibujarDigiBat(e) {
  const cx = e.x + e.w / 2;
  const cy = e.y + e.h / 2;
  const aleteo = Math.sin(tiempo * 18 + e.x0);
  const dir = Math.sign(e.vx) || 1;

  for (const lado of [-1, 1]) {
    ctx.save();
    ctx.translate(cx + lado * 6, cy - 2);
    ctx.rotate(lado * (0.25 + aleteo * 0.35));
    ctx.fillStyle = 'rgba(45,226,255,0.25)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(lado * 22, -12);
    ctx.lineTo(lado * 26, 4);
    ctx.lineTo(lado * 8, 8);
    ctx.closePath();
    ctx.fill();
    glowOn('#2de2ff', 6);
    ctx.strokeStyle = '#2de2ff';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lado * 6, 2); ctx.lineTo(lado * 18, -6);
    ctx.moveTo(lado * 6, 5); ctx.lineTo(lado * 20, 1);
    ctx.stroke();
    glowOff();
    ctx.restore();
  }

  ctx.fillStyle = '#b08ae0';
  ctx.beginPath();
  ctx.moveTo(cx - 7, cy - 6); ctx.lineTo(cx - 4, cy - 14); ctx.lineTo(cx - 1, cy - 6);
  ctx.moveTo(cx + 7, cy - 6); ctx.lineTo(cx + 4, cy - 14); ctx.lineTo(cx + 1, cy - 6);
  ctx.fill();

  glowOn('#ff2fd6', 7);
  ctx.fillStyle = '#3a3160';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 2, 9, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ff2fd6';
  ctx.lineWidth = 1.3;
  ctx.stroke();
  glowOff();

  glowOn('#ff3860', 7);
  ctx.fillStyle = '#ff3860';
  ctx.beginPath(); ctx.arc(cx - 3.5 + dir, cy - 1, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 3.5 + dir, cy - 1, 2.6, 0, Math.PI * 2); ctx.fill();
  glowOff();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(cx - 3, cy + 7); ctx.lineTo(cx - 1, cy + 7); ctx.lineTo(cx - 2, cy + 10);
  ctx.moveTo(cx + 3, cy + 7); ctx.lineTo(cx + 1, cy + 7); ctx.lineTo(cx + 2, cy + 10);
  ctx.fill();
}

function dibujarEscorpion(e) {
  const carga = e.telegraph > 0;
  const cobra = e.disparo > 0;
  const tipX = e.x + e.w - 4, tipY = e.y - 10;
  const paso = Math.sin(tiempo * 10 + e.x0) * 2;

  ctx.strokeStyle = '#6b7488';
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const lx = e.x + 7 + i * 9;
    ctx.beginPath(); ctx.moveTo(lx, e.y + e.h - 6); ctx.lineTo(lx - 3 + paso, e.y + e.h + 2); ctx.stroke();
    const rx2 = e.x + e.w - 7 - i * 9;
    ctx.beginPath(); ctx.moveTo(rx2, e.y + e.h - 6); ctx.lineTo(rx2 + 3 - paso, e.y + e.h + 2); ctx.stroke();
  }

  const fx = Math.sign(e.vx) > 0 ? e.x - 4 : e.x + e.w + 4;
  ctx.fillStyle = '#565e75';
  ctx.beginPath(); ctx.arc(fx, e.y + 18, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx + Math.sign(e.vx) * 4, e.y + 10, 4.5, 0, Math.PI * 2); ctx.fill();

  glowOn('#ff2fd6', 7);
  ctx.fillStyle = '#3a3160';
  rrectPath(e.x + 3, e.y + 7, e.w - 6, e.h - 11, 6); ctx.fill();
  ctx.strokeStyle = '#ff2fd6';
  ctx.lineWidth = 1.3;
  rrectPath(e.x + 3.5, e.y + 7.5, e.w - 7, e.h - 12, 6); ctx.stroke();
  glowOff();
  ctx.strokeStyle = 'rgba(255,47,214,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(e.x + 8, e.y + 13); ctx.lineTo(e.x + e.w - 8, e.y + 13);
  ctx.moveTo(e.x + 8, e.y + 18); ctx.lineTo(e.x + e.w - 8, e.y + 18);
  ctx.stroke();

  ctx.strokeStyle = '#565e75';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(e.x + e.w / 2, e.y + 9);
  ctx.quadraticCurveTo(e.x + e.w + 8, e.y - 2, tipX, tipY);
  ctx.stroke();

  const col = cobra ? '#ff2fd6' : '#ff3860';
  glowOn(col, cobra ? 16 : 9);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(tipX, tipY, cobra ? 5.5 : 3.5 + (carga ? Math.sin(tiempo * 25) * 0.8 : 0), 0, Math.PI * 2); ctx.fill();
  glowOff();

  glowOn('#ff3860', 6);
  ctx.fillStyle = '#ff3860';
  ctx.beginPath(); ctx.arc(e.x + e.w / 2, e.y + 13, 3.2, 0, Math.PI * 2); ctx.fill();
  glowOff();

  if (carga) {
    ctx.globalAlpha = 0.35 + 0.4 * Math.abs(Math.sin(tiempo * 18));
    ctx.strokeStyle = '#ff3860';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX + Math.cos(e.ang) * 430, tipY + Math.sin(e.ang) * 430);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  if (cobra) {
    glowOn('#ff2fd6', 14);
    ctx.strokeStyle = '#ff2fd6';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX + Math.cos(e.ang) * 430, tipY + Math.sin(e.ang) * 430);
    ctx.stroke();
    glowOff();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX + Math.cos(e.ang) * 430, tipY + Math.sin(e.ang) * 430);
    ctx.stroke();
  }
}

function dibujarDisquete(e) {
  const bob = Math.sin(tiempo * 8 + e.x0) * 1;
  const y = e.y + bob;
  fillRR(e.x, y, e.w, e.h, 3, '#2a2f3a');
  glowOn(e.abierto ? '#39ff14' : '#7df9ff', 8);
  ctx.strokeStyle = e.abierto ? '#39ff14' : '#7df9ff';
  ctx.lineWidth = 1.6;
  rrectPath(e.x + 0.5, y + 0.5, e.w - 1, e.h - 1, 3); ctx.stroke();
  glowOff();
  ctx.fillStyle = '#e8e4d8';
  ctx.fillRect(e.x + 5, y + 15, e.w - 10, 12);
  const dir = Math.sign(e.vx) || 1;
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(e.x + 9 + (dir > 0 ? 2 : 0), y + 18, 3, 4);
  ctx.fillRect(e.x + e.w - 12 - (dir > 0 ? 0 : 2), y + 18, 3, 4);
  const slide = e.abierto ? 15 : 0;
  ctx.fillStyle = '#9aa3b5';
  ctx.fillRect(e.x + 4 + slide, y + 3, e.w - 8 - slide, 10);
  ctx.fillStyle = '#565e75';
  ctx.fillRect(e.x + 4 + slide, y + 3, e.w - 8 - slide, 3);
  if (e.abierto) {
    glowOn('#39ff14', 8);
    ctx.fillStyle = '#1d3a1d';
    ctx.beginPath(); ctx.arc(e.x + e.w / 2, y + 8, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(e.x + e.w / 2, y + 8, 6, 0, Math.PI * 2); ctx.stroke();
    glowOff();
    ctx.fillStyle = '#101a30';
    ctx.beginPath(); ctx.arc(e.x + e.w / 2, y + 8, 2, 0, Math.PI * 2); ctx.fill();
  }
}

function dibujarSpider(S) {
  const cx = S.x + S.w / 2, cy = S.y + S.h / 2;
  const flash = S.invuln > 0 && Math.floor(S.invuln * 12) % 2 === 0;
  const dormido = !S.despierto;

  ctx.strokeStyle = flash ? '#5a5470' : '#6b7488';
  ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++) {
    const fase = dormido ? 0 : Math.sin(tiempo * 9 + i * 1.7) * 5;
    for (const lado of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + lado * 16, cy);
      ctx.quadraticCurveTo(cx + lado * (26 + i * 6), cy - 16 + (i % 2) * 8,
                           cx + lado * (22 + i * 8), cy + S.h / 2 + 5 + fase * lado);
      ctx.stroke();
    }
  }

  if (!flash) glowOn('#ff2fd6', 12);
  ctx.fillStyle = flash ? '#4a4460' : '#241f42';
  rrectPath(S.x, S.y, S.w, S.h, 12); ctx.fill();
  ctx.strokeStyle = flash ? '#8a84a5' : '#ff2fd6';
  ctx.lineWidth = 2;
  rrectPath(S.x + 1, S.y + 1, S.w - 2, S.h - 2, 12); ctx.stroke();
  glowOff();

  ctx.strokeStyle = 'rgba(45,226,255,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(S.x + 8, S.y + 8); ctx.lineTo(S.x + S.w - 8, S.y + 8);
  ctx.moveTo(S.x + 8, S.y + S.h - 8); ctx.lineTo(S.x + S.w - 8, S.y + S.h - 8);
  ctx.stroke();

  const eyeC = dormido ? '#552030' : '#ff3860';
  glowOn(eyeC, 8);
  ctx.fillStyle = eyeC;
  for (const [ex, ey, er] of [[-14, -4, 3.5], [-5, -8, 4.5], [5, -8, 4.5], [14, -4, 3.5]]) {
    ctx.beginPath(); ctx.arc(cx + ex, cy + ey, er, 0, Math.PI * 2); ctx.fill();
  }
  glowOff();

  ctx.fillStyle = '#eaffea';
  ctx.beginPath();
  ctx.moveTo(cx - 6, cy + 14); ctx.lineTo(cx - 2, cy + 14); ctx.lineTo(cx - 4, cy + 20);
  ctx.moveTo(cx + 6, cy + 14); ctx.lineTo(cx + 2, cy + 14); ctx.lineTo(cx + 4, cy + 20);
  ctx.fill();

  if (S.despierto) {
    for (let i = 0; i < S.hpMax; i++) {
      ctx.fillStyle = i < S.hp ? '#ff3860' : 'rgba(255,255,255,0.15)';
      ctx.fillRect(S.x + S.w / 2 - (S.hpMax * 12) / 2 + i * 12, S.y - 18, 9, 6);
    }
  }
}

// 🦠 OJO BIÓNICO paramétrico — se APLASTA al recibir daño
function dibujarDragon(D) {
  const cx = D.x + D.w / 2, cy = D.y + D.h / 2;
  const flash = D.invuln > 0 && Math.floor(D.invuln * 12) % 2 === 0;
  const dormido = !D.despierto;
  const R = D.w * 0.47;
  const fade = D.fase === 'tele' ? Math.max(0, D.teleT / OJO_TELE_T) : 1;
  if (fade <= 0) return;
  const aplE = D.aplastado > 0 ? D.aplastado / OJO_APLAST : 0;

  if (dormido) {
    ctx.textAlign = 'center';
    for (let i = 0; i < 3; i++) {
      const zz = (tiempo * 0.7 + i * 0.6) % 1.8;
      ctx.globalAlpha = Math.max(0, 0.85 - zz * 0.5);
      ctx.fillStyle = '#7df9ff';
      ctx.font = `bold ${9 + i * 3}px monospace`;
      ctx.fillText('Z', cx + R * 1.15 + i * 9, D.y - 18 - zz * 26);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1 + 0.3 * aplE, 1 - 0.42 * aplE);
  ctx.translate(-cx, -cy);

  const rotP = tiempo * (dormido ? 0.4 : 1.3);
  for (let i = 0; i < 12; i++) {
    const a = rotP + i * Math.PI * 2 / 12;
    const px0 = cx + Math.cos(a) * R * 0.9, py0 = cy + Math.sin(a) * R * 0.9;
    const px1 = cx + Math.cos(a) * R * 1.24, py1 = cy + Math.sin(a) * R * 1.24;
    const colPin = flash ? '#5a5470' : (i % 2 ? '#ff2fd6' : '#2de2ff');
    glowOn(colPin, 5);
    ctx.strokeStyle = colPin;
    ctx.lineWidth = R * 0.07;
    ctx.beginPath();
    ctx.moveTo(px0, py0); ctx.lineTo(px1, py1);
    ctx.stroke();
    ctx.fillStyle = colPin;
    ctx.beginPath(); ctx.arc(px1, py1, R * 0.09, 0, Math.PI * 2); ctx.fill();
    glowOff();
  }

  if (!dormido && aplE <= 0) {
    for (let k = 0; k < 4; k++) {
      const gy = cy - R * 0.6 + ((k * R * 0.45 + Math.floor(tiempo * 7)) % (R * 1.2));
      const gx = cx + (((k + Math.floor(tiempo * 3)) % 2) ? 1 : -1) * (R + 8 + (k % 2) * 9);
      ctx.globalAlpha = fade * (0.5 + 0.4 * Math.sin(tiempo * 12 + k * 2));
      ctx.strokeStyle = k % 2 ? '#ff2fd6' : '#2de2ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx - R * 0.32, gy); ctx.lineTo(gx + R * 0.32, gy);
      ctx.stroke();
      ctx.globalAlpha = fade;
    }
  }

  if (!flash) glowOn('#ff2fd6', 12);
  const cg = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R * 1.15);
  cg.addColorStop(0, flash ? '#4a4460' : '#3a8aa8');
  cg.addColorStop(0.6, flash ? '#383250' : '#1c4a66');
  cg.addColorStop(1, flash ? '#2a2545' : '#0d2438');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = flash ? '#8a84a5' : '#2de2ff';
  ctx.lineWidth = 2;
  ctx.stroke();
  glowOff();
  ctx.strokeStyle = 'rgba(45,226,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - R * 0.6, cy + R * 0.45); ctx.lineTo(cx + R * 0.6, cy + R * 0.45);
  ctx.moveTo(cx - R * 0.5, cy + R * 0.62); ctx.lineTo(cx + R * 0.5, cy + R * 0.62);
  ctx.stroke();

  const ex = cx - R * 0.07, ey = cy - R * 0.14;
  const enfoca = D.despierto && D.aplastado <= 0 && D.disparaT < 0.5;
  ctx.fillStyle = '#d8f4ff';
  ctx.beginPath(); ctx.arc(ex, ey, R * 0.46, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#0d2438';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  if (D.aplastado > 0) {
    ctx.strokeStyle = '#1a0a14';
    ctx.lineWidth = 2.5;
    for (const sx2 of [-5, 5]) {
      ctx.beginPath();
      ctx.moveTo(ex + sx2 - 3, ey - 3); ctx.lineTo(ex + sx2 + 3, ey + 3);
      ctx.moveTo(ex + sx2 + 3, ey - 3); ctx.lineTo(ex + sx2 - 3, ey + 3);
      ctx.stroke();
    }
  } else if (!dormido) {
    const dxP = (jugador.x + jugador.w / 2) - ex;
    const dyP = (jugador.y + jugador.h / 2) - ey;
    const dP = Math.hypot(dxP, dyP) || 1;
    const px = ex + dxP / dP * R * 0.16, py = ey + dyP / dP * R * 0.16;
    glowOn('#ff3860', enfoca ? 14 : 8);
    ctx.fillStyle = '#ff3860';
    ctx.beginPath(); ctx.arc(px, py, enfoca ? R * 0.32 : R * 0.28, 0, Math.PI * 2); ctx.fill();
    glowOff();
    ctx.fillStyle = '#1a0a14';
    ctx.beginPath(); ctx.arc(px, py, enfoca ? R * 0.16 : R * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(ex - R * 0.14, ey - R * 0.18, R * 0.08, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.strokeStyle = '#552030';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(ex, ey, R * 0.4, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }

  const eyeC = (dormido || D.aplastado > 0) ? '#552030' : '#ff3860';
  glowOn(eyeC, 6);
  const kR = R / 28;
  for (const [oxe, oye, orr] of [[-17, -11, 3.2], [13, -13, 2.8], [17, 8, 3], [-15, 9, 2.6], [2, -19, 2.4]]) {
    const pulso = (dormido || D.aplastado > 0) ? 1 : 0.75 + 0.25 * Math.sin(tiempo * 5 + oxe);
    ctx.fillStyle = eyeC;
    ctx.globalAlpha = fade * pulso;
    ctx.beginPath(); ctx.arc(cx + oxe * kR, cy + oye * kR, orr * kR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a0a14';
    ctx.beginPath(); ctx.arc(cx + oxe * kR, cy + oye * kR, orr * kR * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = fade;
  }
  glowOff();

  ctx.restore();
  ctx.globalAlpha = 1;

  if (D.despierto) {
    for (let i = 0; i < D.hpMax; i++) {
      ctx.fillStyle = i < D.hp ? '#ff3860' : 'rgba(255,255,255,0.15)';
      ctx.fillRect(cx - (D.hpMax * 12) / 2 + i * 12, D.y - 22, 9, 6);
    }
  }
}

// 👻 sombra de teletransporte del Ojo
function dibujarSombraOjo(x, y, t) {
  const R = 42;
  const parpadeo = Math.floor(t * 14) % 2;
  const col = parpadeo ? '#1a0008' : '#ff3860';
  ctx.globalAlpha = 0.45 + 0.3 * Math.sin(t * 22);
  ctx.fillStyle = '#0a0014';
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const a = t * 2 + i * Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * R * 0.9, y + Math.sin(a) * R * 0.9);
    ctx.lineTo(x + Math.cos(a) * R * 1.24, y + Math.sin(a) * R * 1.24);
    ctx.stroke();
  }
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x - R * 0.07, y - R * 0.14, R * 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0a0014';
  ctx.beginPath(); ctx.arc(x - R * 0.07, y - R * 0.14, R * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

// 🧠 LA MENTE ENJAMBRE: red neuronal con sinapsis, pulsos y núcleo rotativo
function dibujarCerebro(C) {
  const cx = C.x + C.w / 2, cy = C.y + C.h / 2;
  const nodos = C.nodos;

  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#9d7dff';
  ctx.beginPath(); ctx.arc(cx, cy, 110, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  for (let i = 0; i < nodos.length; i++) {
    const a = nodos[i];
    if (!a.viva) continue;
    for (let j = i + 1; j < nodos.length; j++) {
      const b = nodos[j];
      if (!b.viva) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > 95) continue;
      ctx.strokeStyle = `rgba(157,125,255,${0.22 + 0.18 * Math.sin(tiempo * 3 + i + j)})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.stroke();
      const t = (tiempo * 0.7 + (i * 3 + j) * 0.37) % 1;
      ctx.fillStyle = '#d0c0ff';
      ctx.beginPath();
      ctx.arc(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let i = 0; i < nodos.length; i++) {
    const nd = nodos[i];
    if (!nd.viva) {
      ctx.strokeStyle = 'rgba(255,56,96,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(nd.x - 4, nd.y - 4); ctx.lineTo(nd.x + 4, nd.y + 4);
      ctx.moveTo(nd.x + 4, nd.y - 4); ctx.lineTo(nd.x - 4, nd.y + 4);
      ctx.stroke();
      continue;
    }
    const esNucleo = i === C.nucIdx;
    const r = esNucleo ? 10 : 6.5;
    const col = esNucleo ? '#d0c0ff' : '#7d9dff';
    glowOn(esNucleo ? '#c0a0ff' : '#5d7dff', esNucleo ? 14 : 7);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(nd.x, nd.y, r, 0, Math.PI * 2); ctx.fill();
    glowOff();
    if (esNucleo) {
      const pulso = 1 + 0.15 * Math.sin(tiempo * 8);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(nd.x, nd.y, r * pulso + 3, 0, Math.PI * 2); ctx.stroke();
      const dxP = (jugador.x + jugador.w / 2) - nd.x;
      const dyP = (jugador.y + jugador.h / 2) - nd.y;
      const dP = Math.hypot(dxP, dyP) || 1;
      ctx.fillStyle = '#ff3860';
      ctx.beginPath(); ctx.arc(nd.x + dxP / dP * 3, nd.y + dyP / dP * 3, 3.5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#1a1030';
      ctx.beginPath(); ctx.arc(nd.x, nd.y, r * 0.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  const vivos = nodos.filter(nd => nd.viva).length;
  if (C.despierto) {
    for (let i = 0; i < NODOS_CEREBRO; i++) {
      ctx.fillStyle = i < vivos ? '#9d7dff' : 'rgba(255,255,255,0.1)';
      ctx.fillRect(cx - (NODOS_CEREBRO * 11) / 2 + i * 11, C.y - 34, 8, 6);
    }
  }
}

// ================================================================
//  🔗 LÁTIGO · 🔫 BITS · 💻 FRAGMENTOS · 📢 ANUNCIO
// ================================================================
function dibujarLatigo() {
  if (jugador.latigoT <= 0) return;
  const ang = jugador.latigoAng;
  const maxL = jugador.latigoModo === 'tiro' ? LATIGO_LARGO * LATIGO_TIRO : LATIGO_LARGO;
  const durTotal = LATIGO_DUR * (jugador.latigoModo === 'tiro' ? 1.3 : 1);
  const p = 1 - jugador.latigoT / durTotal;
  const ext = Math.min(1, p / 0.45);
  const ox = jugador.latigoOx, oy = jugador.latigoOy;
  const nx = -Math.sin(ang), ny = Math.cos(ang);

  let pxFin, pyFin;

  if (jugador.latigoPresa) {
    const e = jugador.latigoPresa;
    pxFin = e.x + e.w / 2 - Math.cos(ang) * 8;
    pyFin = e.y + e.h / 2 - Math.sin(ang) * 8;
  } else if (jugador.latigoAncla) {
    pxFin = jugador.latigoAncla.x;
    pyFin = jugador.latigoAncla.y;
  } else {
    const SEG = 24;
    ctx.strokeStyle = '#8a93a8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG;
      const bx = ox + Math.cos(ang) * maxL * ext * t;
      const by = oy + Math.sin(ang) * maxL * ext * t;
      const onda = Math.sin(t * 9.4 - tiempo * 26) * 8 * ext * t * t;
      const px = bx + nx * onda;
      const py = by + ny * onda;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      pxFin = px; pyFin = py;
    }
    ctx.stroke();
    dibujarGuantePunta(pxFin, pyFin);
    return;
  }

  ctx.strokeStyle = '#8a93a8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(ox, oy);
  ctx.lineTo(pxFin, pyFin);
  ctx.stroke();
  const vib = Math.sin(tiempo * 45) * 2;
  ctx.strokeStyle = 'rgba(138,147,168,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(ox + nx * vib, oy + ny * vib);
  ctx.lineTo(pxFin + nx * vib, pyFin + ny * vib);
  ctx.stroke();
  dibujarGuantePunta(pxFin, pyFin);
}

function dibujarGuantePunta(x, y) {
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, 5, 0, Math.PI * 2);
  ctx.fill();
}

function dibujarBits() {
  ctx.font = 'bold 12px monospace';
  for (const b of bits) {
    ctx.globalAlpha = Math.min(1, b.vida * 4);
    glowOn(b.ch === '1' ? '#7df9ff' : '#ff2fd6', 8);
    ctx.fillStyle = b.ch === '1' ? '#e8fbff' : '#ffd7f5';
    ctx.fillText(b.ch, b.x, b.y);
    glowOff();
  }
  ctx.globalAlpha = 1;
}

function dibujarFrags() {
  ctx.textAlign = 'center';
  for (const f of frags) {
    const k = Math.max(0, 1 - f.d / FRAG_DIST);
    const esc = 0.55 + 0.95 * (1 - k);
    ctx.globalAlpha = k;
    ctx.font = `bold ${Math.round(11 * esc)}px monospace`;
    glowOn('#ff3860', 9 * esc);
    ctx.fillStyle = '#ffd7d7';
    ctx.fillText(f.txt, f.x, f.y);
    glowOff();
    ctx.fillStyle = 'rgba(255,56,96,0.4)';
    ctx.fillText(f.txt, f.x + Math.sin(tiempo * 30) * 2 * esc, f.y);
    ctx.textAlign = 'left';
  }
  ctx.globalAlpha = 1;
}

function dibujarAnuncio() {
  if (!anuncio) return;
  const t = anuncio.t;
  const a = t > 3 ? (3.4 - t) / 0.4 : t < 0.6 ? t / 0.6 : 1;
  ctx.globalAlpha = Math.max(0, a);
  const w = 420, h = 92, x = canvas.width / 2 - w / 2, y = 120;
  ctx.fillStyle = 'rgba(8,12,38,0.9)';
  rrectPath(x, y, w, h, 12); ctx.fill();
  glowOn('#ffd700', 16 + Math.sin(tiempo * 8) * 6);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  rrectPath(x + 1, y + 1, w - 2, h - 2, 12); ctx.stroke();
  glowOff();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 21px monospace';
  ctx.fillText(anuncio.titulo, canvas.width / 2, y + 38);
  ctx.fillStyle = '#7df9ff';
  ctx.font = '14px monospace';
  ctx.fillText(anuncio.sub, canvas.width / 2, y + 66);
  ctx.textAlign = 'left';
  ctx.globalAlpha = 1;
}

// ================= HUD =================
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8,12,38,0.72)';
  rrectPath(x, y, w, h, 8); ctx.fill();
  glowOn('#2de2ff', 8);
  ctx.strokeStyle = '#2de2ff';
  ctx.lineWidth = 1.5;
  rrectPath(x + 0.5, y + 0.5, w - 1, h - 1, 8); ctx.stroke();
  glowOff();
}
function textoHUD(txt, x, y, color = '#e8fbff') {
  glowOn(color, 6);
  ctx.fillStyle = color;
  ctx.font = 'bold 13px monospace';
  ctx.fillText(txt, x, y);
  glowOff();
}
function miniMonitor(x, y, on) {
  ctx.fillStyle = on ? '#e9e2d3' : '#5a5648';
  ctx.fillRect(x, y, 16, 13);
  ctx.fillStyle = on ? '#2a8af0' : '#1a1830';
  ctx.fillRect(x + 2, y + 2, 12, 8);
  if (on) {
    ctx.fillStyle = '#e8fbff';
    ctx.fillRect(x + 5, y + 4, 2, 3);
    ctx.fillRect(x + 9, y + 4, 2, 3);
    ctx.fillRect(x + 6, y + 8, 4, 1.5);
  }
}
function circuito(x, y, w, h, seed) {
  ctx.strokeStyle = 'rgba(45,226,255,0.3)';
  ctx.lineWidth = 1;
  ctx.fillStyle = 'rgba(45,226,255,0.5)';
  const n = Math.max(2, Math.floor(w / 60));
  for (let i = 0; i < n; i++) {
    const lx = x + 10 + ((seed * 31 + i * 47) % Math.max(1, w - 30));
    const ly = y + 8 + ((seed * 17 + i * 29) % Math.max(1, h - 16));
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(lx + 18, ly);
    ctx.lineTo(lx + 24, ly + 6);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(lx, ly, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(lx + 24, ly + 6, 1.8, 0, Math.PI * 2); ctx.fill();
  }
}

// ================= DRAW =================
function draw() {
  dibujarFondo();
  dibujarReflejo();   // 🪞 ciudad espejada bajo el grid (v14.2)

  for (const c of cubosGlitch) {
    const sx = c.x - cam.x * 0.7;
    if (sx < -30 || sx > canvas.width + 30) continue;
    const sy = c.y + Math.sin(tiempo * 0.5 + c.fase) * 8 - cam.y * 0.35;
    const flick = Math.floor(tiempo * 8 + c.fase * 3) % 5;
    ctx.globalAlpha = flick === 0 ? 0.35 : 0.8;
    ctx.fillStyle = '#182855';
    ctx.fillRect(sx, sy, c.tam, c.tam);
    ctx.fillStyle = '#2de2ff';
    ctx.fillRect(sx + (flick % 3) * 2, sy + 3, c.tam * 0.6, 2);
    ctx.fillStyle = '#ff2fd6';
    ctx.fillRect(sx - (flick % 2) * 3, sy + c.tam - 5, c.tam * 0.5, 2);
    ctx.globalAlpha = 1;
  }

  const shakeX = (Math.random() * 2 - 1) * shake;
  const shakeY = (Math.random() * 2 - 1) * shake;

  ctx.save();
  ctx.translate(-Math.round(cam.x + shakeX), -Math.round(cam.y + shakeY));

  for (const c of capacitores) dibujarCapacitor(c);

  for (const a of arcos) dibujarArcoHardware(a);
  for (const r of rios) dibujarRio(r);

  if (nivelActivo < 3) {
    ctx.strokeStyle = '#3a4258';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(truss.x1, truss.y); ctx.lineTo(truss.x2, truss.y);
    ctx.moveTo(truss.x1, truss.y + 16); ctx.lineTo(truss.x2, truss.y + 16);
    ctx.stroke();
    ctx.lineWidth = 1.5;
    for (let x = truss.x1; x < truss.x2 - 20; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, truss.y); ctx.lineTo(x + 24, truss.y + 16);
      ctx.moveTo(x + 24, truss.y); ctx.lineTo(x, truss.y + 16);
      ctx.stroke();
    }
    const ang = Math.sin(tiempo * 1.3) * 0.38;
    const mx = colgante.px + Math.sin(ang) * colgante.largo;
    const my = colgante.py + Math.cos(ang) * colgante.largo;
    ctx.strokeStyle = '#20263c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(colgante.px, colgante.py);
    ctx.lineTo(mx, my);
    ctx.stroke();
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(ang * 0.5);
    fillRR(-14, 0, 28, 24, 4, '#e9e2d3');
    fillRR(-10, 3, 20, 15, 3, '#1e3f7a');
    ctx.fillStyle = '#cfe8ff';
    ctx.fillRect(-6, 7, 3, 4);
    ctx.fillRect(3, 7, 3, 4);
    ctx.fillRect(-2, 14, 5, 2);
    ctx.fillStyle = '#9aa3b5';
    ctx.fillRect(-8, 24, 5, 4);
    ctx.fillRect(3, 24, 5, 4);
    ctx.restore();
  }

  for (const p of solidas) {
    if (p.invisible) continue;
    ctx.fillStyle = '#0d1b3e';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    circuito(p.x, p.y, p.w, p.h, Math.floor(p.x));
    glowOn(tintePlat, 9);
    ctx.strokeStyle = tintePlat;
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);
    glowOff();
  }

  for (const p of oneWays) {
    glowOn('#ffd700', 10);
    ctx.fillStyle = '#3a2e05';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);
    glowOff();
    ctx.fillStyle = 'rgba(255,215,0,0.4)';
    for (let dx = 6; dx < p.w - 8; dx += 14) ctx.fillRect(p.x + dx, p.y + p.h + 3, 8, 2);
  }

  for (const v of ventiladores) dibujarVentilador(v);

  for (const m of monedas) {
    if (m.tomada) continue;
    const bob = Math.sin(tiempo * 3 + m.fase) * 4;
    const giro = Math.abs(Math.cos(tiempo * 3 + m.fase));
    glowOn('#ffd700', 12);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.ellipse(m.x + 10, m.y + 10 + bob, Math.max(1.5, 9 * giro), 9, 0, 0, Math.PI * 2);
    ctx.fill();
    glowOff();
    ctx.fillStyle = '#b8860b';
    ctx.beginPath();
    ctx.ellipse(m.x + 10, m.y + 10 + bob, Math.max(0.8, 4.5 * giro), 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    if ((tiempo * 0.8 + m.fase) % 2.5 < 0.22) {
      ctx.fillStyle = '#fff';
      const sx = m.x + 15, sy = m.y + 2 + bob;
      ctx.fillRect(sx - 1, sy - 4, 2, 8);
      ctx.fillRect(sx - 4, sy - 1, 8, 2);
    }
  }

  // 🔋 baterías
  for (const h of baterias) {
    const hy = h.y + (h.emerge < 1 ? (1 - h.emerge) * h.h : 0);
    const bg = ctx.createLinearGradient(h.x, 0, h.x + h.w, 0);
    bg.addColorStop(0, '#12241a');
    bg.addColorStop(0.4, '#1d5c3c');
    bg.addColorStop(1, '#0d1b12');
    ctx.fillStyle = bg;
    rrectPath(h.x + 3, hy + 5, h.w - 6, h.h - 7, 4); ctx.fill();
    glowOn('#39ff14', 8);
    ctx.strokeStyle = '#39ff14';
    ctx.lineWidth = 1.6;
    rrectPath(h.x + 3.5, hy + 5.5, h.w - 7, h.h - 8, 4); ctx.stroke();
    glowOff();
    ctx.fillStyle = '#9aa3b5';
    ctx.fillRect(h.x + 8, hy + 1, 4, 5);
    ctx.fillRect(h.x + h.w - 12, hy + 1, 4, 5);
    ctx.fillStyle = '#0d1b12';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('+', h.x + 8, hy + h.h - 5);
    ctx.fillText('−', h.x + h.w - 13, hy + h.h - 5);
    const barras = 2 + Math.floor((tiempo * 4) % 3);
    ctx.fillStyle = 'rgba(57,255,20,0.75)';
    for (let k = 0; k < barras; k++) ctx.fillRect(h.x + 16, hy + 10 + k * 5, 8, 3);
  }

  for (const b of bloquesQ) {
    const by = b.y + (b.bump > 0 ? -Math.sin(b.bump * Math.PI) * 8 : 0);
    fillRR(b.x, by, b.w, b.h, 5, '#0f4a2e');
    glowOn(b.usado ? '#1d5c3c' : '#39ff14', 8);
    ctx.strokeStyle = b.usado ? '#1d5c3c' : '#39ff14';
    ctx.lineWidth = 2;
    rrectPath(b.x + 1, by + 1, b.w - 2, b.h - 2, 5); ctx.stroke();
    glowOff();
    ctx.strokeStyle = 'rgba(57,255,20,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(b.x + 4, by + 9); ctx.lineTo(b.x + 4, by + 4); ctx.lineTo(b.x + 9, by + 4);
    ctx.moveTo(b.x + b.w - 4, by + b.h - 9); ctx.lineTo(b.x + b.w - 4, by + b.h - 4); ctx.lineTo(b.x + b.w - 9, by + b.h - 4);
    ctx.stroke();
    ctx.fillStyle = b.usado ? '#1a3a2a' : '#eaffe9';
    ctx.font = 'bold 20px monospace';
    if (!b.usado) glowOn('#39ff14', 6);
    ctx.fillText('?', b.x + 12, by + 24);
    glowOff();
  }
  for (const m of monedasSalto) {
    const giro = Math.abs(Math.cos(tiempo * 12));
    ctx.globalAlpha = Math.min(1, m.vida * 3);
    glowOn('#ffd700', 10);
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.ellipse(m.x + 10, m.y + 10, Math.max(1.5, 9 * giro), 9, 0, 0, Math.PI * 2);
    ctx.fill();
    glowOff();
    ctx.globalAlpha = 1;
  }

  // 🌀 ARCO CPU + PORTAL: detrás de las criaturas
  {
    const ax = portal.x, base = 502, halfW = 80, topY = 388;
    ctx.fillStyle = '#10142e';
    ctx.beginPath();
    ctx.moveTo(ax - halfW, base);
    ctx.lineTo(ax - halfW, topY);
    ctx.arc(ax, topY, halfW, Math.PI, 0);
    ctx.lineTo(ax + halfW, base);
    ctx.closePath();
    ctx.fill();
    glowOn('#2de2ff', 8);
    ctx.strokeStyle = '#2de2ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    glowOff();
    const ih = halfW - 17;
    ctx.fillStyle = '#04050e';
    ctx.beginPath();
    ctx.moveTo(ax - ih, base);
    ctx.lineTo(ax - ih, topY + 10);
    ctx.arc(ax, topY + 10, ih, Math.PI, 0);
    ctx.lineTo(ax + ih, base);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1a2450';
    ctx.fillRect(ax - 16, topY - 30, 32, 20);
    glowOn('#ffd700', 6);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(ax - 16, topY - 30, 32, 20);
    glowOff();
    ctx.fillStyle = '#9aa3b5';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(ax - 14 + i * 8, topY - 34, 3, 4);
      ctx.fillRect(ax - 14 + i * 8, topY - 10, 3, 4);
    }
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('CPU', ax - 9, topY - 16);
  }

  {
    const s = portal.activo ? portal.succ : 0;
    const dim = !portal.activo;
    ctx.save();
    ctx.translate(portal.x, portal.y);
    ctx.scale(Math.max(0.18, 1 - 0.82 * s), 1 + 0.15 * s);

    const ng = ctx.createRadialGradient(0, 0, 4, 0, 0, portal.r * 0.82);
    ng.addColorStop(0, '#000010');
    ng.addColorStop(0.7, dim ? '#070617' : '#0a0630');
    ng.addColorStop(1, dim ? '#10142e' : '#141a5e');
    ctx.fillStyle = ng;
    ctx.beginPath(); ctx.arc(0, 0, portal.r * 0.82, 0, Math.PI * 2); ctx.fill();

    ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      const rot = tiempo * (dim ? 0.4 : 2 + k * 0.7) * (1 + s * 2.5) + k * 2.1;
      ctx.strokeStyle = k % 2 ? `rgba(255,47,214,${dim ? 0.15 : 0.5})` : `rgba(45,226,255,${dim ? 0.15 : 0.5})`;
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 1.8; a += 0.25) {
        const rr = portal.r * 0.75 * (1 - a / (Math.PI * 2));
        const px = Math.cos(rot + a) * rr, py = Math.sin(rot + a) * rr;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    if (!dim) {
      ctx.fillStyle = '#7df9ff';
      for (let i = 0; i < 10; i++) {
        const t = (tiempo * 0.55 + i / 10) % 1;
        const ang = i * 2.4 + tiempo * 1.5 * (1 + s);
        const rr = portal.r * (1.05 - t * 1.02) * (0.4 + 0.6 * (i % 3) / 2);
        ctx.globalAlpha = 0.3 + 0.7 * (1 - t);
        ctx.beginPath(); ctx.arc(Math.cos(ang) * rr, Math.sin(ang) * rr, 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    glowOn(dim ? '#3a4258' : (s > 0.4 ? '#ff2fd6' : '#2de2ff'), dim ? 4 : 14);
    ctx.strokeStyle = dim ? '#3a4258' : (s > 0.4 ? '#ff2fd6' : '#2de2ff');
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, portal.r, 0, Math.PI * 2); ctx.stroke();
    glowOff();

    ctx.strokeStyle = dim ? 'rgba(90,100,120,0.4)' : 'rgba(45,226,255,0.75)';
    ctx.fillStyle = dim ? 'rgba(90,100,120,0.5)' : 'rgba(125,249,255,0.9)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const ang = i * Math.PI / 5 + tiempo * 0.25;
      const c = Math.cos(ang), sn = Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(c * portal.r, sn * portal.r);
      ctx.lineTo(c * (portal.r + 10), sn * (portal.r + 10));
      ctx.stroke();
      ctx.beginPath(); ctx.arc(c * (portal.r + 13), sn * (portal.r + 13), 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = dim ? 'rgba(90,100,120,0.3)' : 'rgba(255,47,214,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, portal.r + 18, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();

    if (s > 0.05 && portal.activo) {
      for (let i = 0; i < 3; i++) {
        const t = (tiempo * 1.4 + i / 3) % 1;
        const rr = portal.r * (1.6 - t * 1.3);
        ctx.strokeStyle = `rgba(125,249,255,${(1 - t) * 0.35 * s})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(portal.x, portal.y, rr * Math.max(0.18, 1 - 0.82 * s), rr, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    if (dim) {
      const pulso = 0.5 + 0.5 * Math.sin(tiempo * 4);
      const bloqueoTxt = NIVELES[nivelActivo].dragon ? 'VENCE AL OJO BIÓNICO'
                       : NIVELES[nivelActivo].cerebro ? 'VENCE A LA MENTE'
                       : 'VENCE A LA ARAÑA';
      ctx.textAlign = 'center';
      ctx.globalAlpha = 0.4 + 0.6 * pulso;
      glowOn('#ff3860', 8);
      ctx.fillStyle = '#ff3860';
      ctx.font = 'bold 13px monospace';
      ctx.fillText('🔒 NÚCLEO ACTIVO — ' + bloqueoTxt, portal.x, portal.y - portal.r - 34);
      glowOff();
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  // 👾 enemigos: DELANTE del portal
  for (const e of enemigos) {
    if (!e.vivo) continue;
    if (e.tipo === 'bot') dibujarCyberBot(e);
    else if (e.tipo === 'planta') dibujarDataPlant(e);
    else if (e.tipo === 'escorpion') dibujarEscorpion(e);
    else if (e.tipo === 'disquete') dibujarDisquete(e);
    else dibujarDigiBat(e);
  }

  // 👻 sombra del teletransporte + jefes
  if (dragon && dragon.vivo && dragon.fase === 'tele')
    dibujarSombraOjo(dragon.teleX + dragon.w / 2, dragon.baseY + Math.sin(tiempo * 1.8) * 16, tiempo);
  if (spider && spider.vivo) dibujarSpider(spider);
  if (dragon && dragon.vivo) dibujarDragon(dragon);
  if (cerebro && cerebro.vivo) dibujarCerebro(cerebro);
  dibujarBits();
  dibujarFrags();

  for (const p of particulas) {
    ctx.globalAlpha = Math.max(0, p.vida / p.vidaMax);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.tam / 2, p.y - p.tam / 2, p.tam, p.tam);
  }
  ctx.globalAlpha = 1;

  if (estado !== 'gameover') {
    dibujarSombra();
    const visible = jugador.invuln <= 0 || Math.floor(jugador.invuln * 15) % 2 === 0;
    if (visible) dibujarJugador();
    dibujarLatigo();

    // 🛡️ hexágonos del firewall
    if (jugador.escudo) {
      const cxS = jugador.x + jugador.w / 2, cyS = jugador.y + jugador.h / 2;
      const op = 0.35 + 0.4 * (jugador.code / CODE_MAX);
      for (let h = 0; h < 6; h++) {
        const angH = tiempo * 1.6 + h * Math.PI / 3;
        const hx = cxS + Math.cos(angH) * 34;
        const hy = cyS + Math.sin(angH) * 26;
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(angH);
        ctx.globalAlpha = op * (0.7 + 0.3 * Math.sin(tiempo * 6 + h));
        glowOn('#39ff14', 8);
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a2 = k * Math.PI / 3;
          const px2 = Math.cos(a2) * 7, py2 = Math.sin(a2) * 7;
          if (k === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
        }
        ctx.closePath();
        ctx.stroke();
        glowOff();
        ctx.fillStyle = 'rgba(57,255,20,0.25)';
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      if (escudoFlash > 0) {
        ctx.globalAlpha = escudoFlash * 0.5;
        glowOn('#39ff14', 16);
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cxS, cyS, 38, 0, Math.PI * 2);
        ctx.stroke();
        glowOff();
        ctx.globalAlpha = 1;
      }
    }

    // ⚡ onda expansiva EMP
    if (empOnda > 0) {
      empOnda -= 1 / 40;
      ctx.globalAlpha = Math.max(0, empOnda);
      glowOn('#39ff14', 14);
      ctx.strokeStyle = '#39ff14';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(jugador.x + 16, jugador.y + 16, (1 - Math.max(0, empOnda)) * EMP_RADIO, 0, Math.PI * 2);
      ctx.stroke();
      glowOff();
      ctx.globalAlpha = 1;
    }

    // 🏃 anillo Overclock
    if (jugador.overclockT > 0) {
      ctx.globalAlpha = 0.3 + 0.2 * Math.sin(tiempo * 20);
      glowOn('#ff9a5a', 10);
      ctx.strokeStyle = '#ff9a5a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(jugador.x + 16, jugador.y + 16, 24, 0, Math.PI * 2);
      ctx.stroke();
      glowOff();
      ctx.globalAlpha = 1;
    }

    // 💻 fragmentos de código en el mundo
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    for (const f of fragsDrop) {
      ctx.globalAlpha = Math.min(1, f.vida) * (0.7 + 0.3 * Math.sin(tiempo * 7 + f.fase));
      glowOn('#39ff14', 7);
      ctx.fillStyle = '#d0ffd0';
      ctx.fillText(f.ch, f.x, f.y);
      glowOff();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  if (debug) {
    ctx.strokeStyle = 'lime';
    ctx.strokeRect(jugador.x + 0.5, jugador.y + 0.5, jugador.w - 1, jugador.h - 1);
    ctx.strokeStyle = 'rgba(0,255,0,0.4)';
    for (const p of oneWays) ctx.strokeRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1);
    for (const e of enemigos) {
      if (!e.vivo) continue;
      if (e.tipo === 'planta') ctx.strokeRect(e.x - 1.5, e.headY + 0.5, e.w + 3, 26);
      else ctx.strokeRect(e.x + 0.5, e.y + 0.5, e.w - 1, e.h - 1);
    }
    if (spider && spider.vivo) ctx.strokeRect(spider.x + 0.5, spider.y + 0.5, spider.w - 1, spider.h - 1);
    if (dragon && dragon.vivo) ctx.strokeRect(dragon.x + 0.5, dragon.y + 0.5, dragon.w - 1, dragon.h - 1);
    const nb = nucleoCerebro();
    if (nb) ctx.strokeRect(nb.x + 0.5, nb.y + 0.5, nb.w - 1, nb.h - 1);
    ctx.strokeStyle = 'rgba(0,255,255,0.5)';
    for (const v of ventiladores) ctx.strokeRect(v.x, v.y - v.altura, v.w, v.altura);
    if (jugador.enSuelo) {
      const hSalto = (FUERZA_SALTO * FUERZA_SALTO) / (2 * GRAVEDAD);
      ctx.strokeStyle = 'rgba(255,255,0,0.6)';
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(jugador.x - 200, jugador.y - hSalto);
      ctx.lineTo(jugador.x + jugador.w + 200, jugador.y - hSalto);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  ctx.restore();

  // 🌧️ lluvia frontal: sobre el mundo, BAJO el HUD
  dibujarLluviaFrontal();

  // ===== HUD (siempre por encima de todo) =====
  panel(10, 10, 128, 30);
  textoHUD(`PUNTOS ${puntos}`, 22, 30);

  panel(148, 10, 92, 30);
  glowOn('#ffd700', 6);
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(165, 25, 7, 0, Math.PI * 2); ctx.fill();
  glowOff();
  textoHUD(`x${monedasTomadas}`, 180, 30, '#ffd700');

  panel(250, 10, 118, 30);
  const mm = String(Math.floor(tiempoJuego / 60)).padStart(2, '0');
  const ss = String(Math.floor(tiempoJuego % 60)).padStart(2, '0');
  textoHUD(`TIEMPO ${mm}:${ss}`, 262, 30);

  panel(378, 10, 168, 30);
  textoHUD('VIDAS', 390, 30);
  for (let i = 0; i < 3; i++) miniMonitor(440 + i * 24, 18, i < jugador.hp);

  panel(566, 10, 112, 30);
  textoHUD(`REC ${record}`, 580, 30, '#ff2fd6');

  panel(688, 10, 100, 30);
  textoHUD(`NIV ${nivelActivo + 1}/${NIVELES.length}`, 700, 30, '#7df9ff');

  // 🔗🔫 HUD de armas + ⚡ código + 🛡️ firewall + poderes
  let hx2 = 596;
  if (jugador.tieneLatigo) {
    ctx.font = 'bold 9px monospace';
    glowOn('#ffd700', 5);
    ctx.fillStyle = '#ffd700';
    ctx.fillText('🔗 X', hx2, 56);
    glowOff();
    ctx.fillStyle = jugador.latigoT > 0 ? 'rgba(255,215,0,0.3)' : '#ffd700';
    ctx.fillRect(hx2 + 36, 50, 22, 3);
    hx2 += 64;
  }
  if (jugador.tienePistola) {
    ctx.font = 'bold 9px monospace';
    glowOn('#7df9ff', 5);
    ctx.fillStyle = '#7df9ff';
    ctx.fillText('LÁSER C', hx2, 56);
    glowOff();
    for (let i = 0; i < BIT_AMMO_MAX; i++) {
      ctx.fillStyle = i < Math.floor(jugador.bitAmmo)
        ? `hsl(${(i / (BIT_AMMO_MAX - 1)) * 120}, 90%, 55%)`
        : 'rgba(255,255,255,0.12)';
      ctx.fillRect(hx2 + 48 + i * 6, 48, 5, 9);
    }
  }
  if (jugador.tieneLatigo) {
    ctx.font = 'bold 9px monospace';
    glowOn('#39ff14', 6);
    ctx.fillStyle = '#39ff14';
    ctx.fillText('</> CODE', 596, 70);
    glowOff();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(652, 62, 136, 9);
    ctx.fillStyle = '#39ff14';
    ctx.fillRect(652, 62, 136 * (jugador.code / CODE_MAX), 9);
    glowOn('#39ff14', 4);
    ctx.fillRect(652 + 136 * (jugador.code / CODE_MAX) - 2, 61, 3, 11);
    glowOff();
    if (jugador.escudo) {
      ctx.font = 'bold 9px monospace';
      glowOn('#39ff14', 8);
      ctx.fillStyle = '#39ff14';
      ctx.fillText('🛡️ FIREWALL ACTIVO [V]', 596, 84);
      glowOff();
    } else if (jugador.code >= SHIELD_MIN) {
      ctx.fillStyle = 'rgba(57,255,20,0.5)';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('[V] firewall', 596, 84);
    }
    ctx.font = 'bold 9px monospace';
    const cEmp = jugador.code >= EMP_COSTE ? '#39ff14' : 'rgba(255,255,255,0.2)';
    glowOn(cEmp, 5); ctx.fillStyle = cEmp; ctx.fillText('⚡B', 596, 98); glowOff();
    const cOvr = jugador.code >= OVER_COSTE ? '#ff9a5a' : 'rgba(255,255,255,0.2)';
    glowOn(cOvr, 5); ctx.fillStyle = cOvr; ctx.fillText('🏃G', 640, 98); glowOff();
    const cGlt = jugador.code >= GLITCH_COSTE ? '#ff2fd6' : 'rgba(255,255,255,0.2)';
    glowOn(cGlt, 5); ctx.fillStyle = cGlt; ctx.fillText('🦘2×', 684, 98); glowOff();
  }

  if (!audio.habilitado) textoHUD('🔇 M', canvas.width - 45, canvas.height - 24, '#ff3860');

  if (debug) {
    ctx.fillStyle = 'lime';
    ctx.font = '12px monospace';
    ctx.fillText(`x:${Math.round(jugador.x)} y:${Math.round(jugador.y)} vy:${Math.round(jugador.vy)} 🌀:${jugador.enCorriente ? 'SÍ' : 'no'} 💻:${Math.floor(jugador.code)}`, 10, 78);
  }

  // ===== OVERLAYS =====
  if (estado === 'gameover' || estado === 'victoria') {
    ctx.fillStyle = 'rgba(5,5,25,0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    const colorTitulo = estado === 'victoria' ? '#ffd700' : '#ff3860';
    glowOn(colorTitulo, 20);
    ctx.fillStyle = colorTitulo;
    ctx.font = 'bold 40px monospace';
    ctx.fillText(estado === 'victoria' ? '¡JUEGO COMPLETADO!' : 'GAME OVER', canvas.width / 2, 150);
    glowOff();
    ctx.fillStyle = '#e8fbff';
    ctx.font = '18px monospace';
    if (estado === 'victoria') {
      ctx.fillText(`Monedas: ${monedasTomadas}   Puntos: ${puntos}   Tiempo: ${mm}:${ss}`, canvas.width / 2, 200);
      ctx.fillText(`Caídas: ${caidas}   —   La Mente Central ha sido liberada 🧠`, canvas.width / 2, 228);
    } else {
      ctx.fillText(`Llegaste con ${puntos} puntos`, canvas.width / 2, 200);
    }
    if (nuevoRecord) {
      const pulso = 0.6 + 0.4 * Math.sin(tiempo * 6);
      glowOn('#ffd700', 15);
      ctx.globalAlpha = pulso;
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 24px monospace';
      ctx.fillText('★ ¡NUEVO RÉCORD! ★', canvas.width / 2, 270);
      ctx.globalAlpha = 1;
      glowOff();
    } else {
      ctx.fillStyle = '#9adfff';
      ctx.font = '16px monospace';
      ctx.fillText(`Récord: ${record}`, canvas.width / 2, 265);
    }
    glowOn('#2de2ff', 8);
    ctx.fillStyle = '#2de2ff';
    ctx.font = '16px monospace';
    ctx.fillText(estado === 'victoria' ? 'ENTER para volver al menú' : 'ENTER o R para reintentar', canvas.width / 2, 315);
    glowOff();
    ctx.textAlign = 'left';
  }

  dibujarAnuncio();

  ctx.fillStyle = 'rgba(160,235,255,0.55)';
  ctx.font = '12px monospace';
  ctx.fillText('← → mover | ESPACIO saltar | ↑ apuntar | C disparar 8 dir | X látigo (X+↑ trepa) | V escudo | B EMP | G overclock', 10, canvas.height - 10);
}

  dibujarFondo();
  dibujarReflejo();   // 🪞 el menú también se refleja

  const cx = canvas.width / 2;
  const piesY = 420;

  glowOn('#2de2ff', 14);
  ctx.strokeStyle = '#2de2ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, piesY + 5, 85, 11, 0, 0, Math.PI * 2);
  ctx.stroke();
  glowOff();

  jugador.x = cx - jugador.w / 2;
  jugador.y = piesY - jugador.h;
  jugador.enSuelo = true;
  jugador.coyoteTimer = COYOTE_TIME;
  jugador.vx = 0; jugador.vy = 0;
  jugador.invuln = 0;
  jugador.escalaX = 1; jugador.escalaY = 1;
  ctx.save();
  ctx.translate(cx, piesY);
  ctx.scale(2, 2);
  ctx.translate(-cx, -piesY);
  dibujarJugador();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.font = 'bold 54px monospace';
  glowOn('#ff2fd6', 18);
  ctx.fillStyle = '#ff2fd6';
  ctx.fillText('COMPUBOY', cx + 4, 112);
  glowOff();
  glowOn('#2de2ff', 18);
  ctx.fillStyle = '#d8fbff';
  ctx.fillText('COMPUBOY', cx, 108);
  glowOff();

  ctx.fillStyle = 'rgba(160,235,255,0.7)';
  ctx.font = '14px monospace';
  ctx.fillText('— 10 NIVELES · LÁTIGO · CÓDIGO · FIREWALL · OJO BIÓNICO · MENTE ENJAMBRE —', cx, 138);

  panel(cx - 110, 158, 220, 32);
  ctx.font = 'bold 16px monospace';
  glowOn('#ff2fd6', 8);
  ctx.fillStyle = '#ff2fd6';
  ctx.fillText(`RÉCORD  ${record}`, cx, 180);
  glowOff();

  const alpha = 0.55 + 0.45 * Math.sin(tiempo * 3.2);
  ctx.globalAlpha = alpha;
  glowOn('#ffd700', 12);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('PULSA ENTER PARA JUGAR', cx, 242);
  ctx.globalAlpha = 1;
  glowOff();

  ctx.fillStyle = 'rgba(160,235,255,0.6)';
  ctx.font = '12px monospace';
  ctx.fillText('ESPACIO saltar · ↑ apuntar · C disparar 8 direcciones · X látigo · V escudo · B EMP · G overclock', cx, canvas.height - 32);
  ctx.fillText('P pausa · O visor de poses · F debug · M sonido · SHIFT+1-9-0 saltar nivel · R reinicio', cx, canvas.height - 16);
  ctx.textAlign = 'left';
}

// ================================================================
//  ⏸️ PAUSA + 🧍 VISOR DE POSES
// ================================================================
function actualizarPose(dt) {
  tiempo += dt;
  jugador.escalaX += (1 - jugador.escalaX) * Math.min(1, 10 * dt);
  jugador.escalaY += (1 - jugador.escalaY) * Math.min(1, 10 * dt);
  jugador.turnTimer = Math.max(0, jugador.turnTimer - dt);
  if (POSES[poseIdx] === 'run') jugador.fasePaso += 14 * dt;
}

function configurarPose() {
  const cara = POSES[poseIdx];
  jugador.invuln = 0;
  jugador.enSuelo = true;
  jugador.enOneWay = false;
  jugador.coyoteTimer = COYOTE_TIME;
  jugador.vx = 0; jugador.vy = 0;
  teclas['ArrowDown'] = teclas['KeyS'] = false;
  if (cara === 'run')        jugador.vx = 260;
  else if (cara === 'salto') { jugador.enSuelo = false; jugador.coyoteTimer = 0; jugador.vy = -400; }
  else if (cara === 'caida') { jugador.enSuelo = false; jugador.coyoteTimer = 0; jugador.vy = 400; }
  else if (cara === 'dano')  jugador.invuln = DURACION_INVULN;
  else if (cara === 'duck')  teclas['ArrowDown'] = true;
}

function dibujarVisorPose() {
  const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
  g.addColorStop(0, '#0a0a2e');
  g.addColorStop(1, '#2d1560');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(45,226,255,0.12)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 320); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let i = 0; i < 6; i++) {
    const y = 320 + i * i * 4.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  configurarPose();

  jugador.x = canvas.width / 2 - jugador.w / 2;
  jugador.y = 330 - jugador.h;
  const cx = jugador.x + jugador.w / 2;
  const piesY = jugador.y + jugador.h;

  glowOn('#2de2ff', 12);
  ctx.strokeStyle = '#2de2ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, piesY + 6, 60, 10, 0, 0, Math.PI * 2);
  ctx.stroke();
  glowOff();

  ctx.save();
  ctx.translate(cx, piesY);
  ctx.scale(3.4, 3.4);
  ctx.translate(-cx, -piesY);
  dibujarJugador();
  ctx.restore();

  ctx.textAlign = 'center';
  glowOn('#2de2ff', 10);
  ctx.fillStyle = '#2de2ff';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('VISOR DE POSES', canvas.width / 2, 60);
  glowOff();
  glowOn('#ffd700', 8);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 18px monospace';
  ctx.fillText(`► ${POSES[poseIdx].toUpperCase()} ◄`, canvas.width / 2, 100);
  glowOff();
  ctx.fillStyle = '#9adfff';
  ctx.font = '14px monospace';
  ctx.fillText('↑ ↓ cambiar pose   ← → voltear   F hitboxes   O volver al juego', canvas.width / 2, canvas.height - 25);
  ctx.textAlign = 'left';
}

function overlayPausa() {
  ctx.fillStyle = 'rgba(5,5,25,0.65)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  glowOn('#2de2ff', 15);
  ctx.fillStyle = '#2de2ff';
  ctx.font = 'bold 34px monospace';
  ctx.fillText('PAUSA', canvas.width / 2, 195);
  glowOff();
  ctx.fillStyle = '#e8fbff';
  ctx.font = '15px monospace';
  ctx.fillText('P continuar · O visor de poses · F debug', canvas.width / 2, 235);
  ctx.textAlign = 'left';
}

// ================= GAME LOOP 🔄 =================
let ultimoTiempo = performance.now();
function loop(ahora) {
  const dt = Math.min((ahora - ultimoTiempo) / 1000, DT_MAX);
  ultimoTiempo = ahora;

  if (modoPose) {
    actualizarPose(dt);
    dibujarVisorPose();
  } else if (estado === 'menu') {
    tiempo += dt;
    actualizarParticulas(dt);
    cam.x = (tiempo * 26) % Math.max(1, mundoAncho - canvas.width);
    dibujarMenu();
  } else if (estado === 'transicion') {
    tiempo += dt;
    transT -= dt;
    actualizarParticulas(dt);
    const k = Math.min(1, 6 * dt);
    jugador.x += (portal.x - jugador.w / 2 - jugador.x) * k;
    jugador.y += (portal.y - jugador.h / 2 - jugador.y) * k;
    jugador.escalaX += (0.05 - jugador.escalaX) * k;
    jugador.escalaY += (0.05 - jugador.escalaY) * k;
    portal.succ = Math.min(1, portal.succ + dt * 2);
    draw();
    ctx.fillStyle = 'rgba(5,5,25,0.78)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    glowOn('#2de2ff', 16);
    ctx.fillStyle = '#2de2ff';
    ctx.font = 'bold 36px monospace';
    ctx.fillText(`NIVEL ${transNivel + 1}`, canvas.width / 2, 185);
    glowOff();
    glowOn('#ff2fd6', 10);
    ctx.fillStyle = '#ff2fd6';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(NIVELES[transNivel].nombre, canvas.width / 2, 222);
    glowOff();
    ctx.fillStyle = '#9adfff';
    ctx.font = '13px monospace';
    ctx.fillText('▓▓▓ CARGANDO SECTOR ▓▓▓', canvas.width / 2, 252);
    ctx.textAlign = 'left';
    if (transT <= 0) { cargarNivel(transNivel, false); estado = 'jugando'; }
  } else {
    if (!pausado) {
      update(dt);
      actualizarCamara(dt);
      if (anuncio) { anuncio.t -= dt; if (anuncio.t <= 0) anuncio = null; }
    }
    draw();
    if (pausado) overlayPausa();
  }
  requestAnimationFrame(loop);
}
cargarNivel(0, false);
estado = 'menu';
requestAnimationFrame(loop);
</script>
