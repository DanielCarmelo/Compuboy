function cargarNivel(n, reintentando = false, testing = false) {
  cargarNivel.testing = testing;
  const N = NIVELES[n];
  nivelActivo = n;
  mundoAncho = N.ancho || 2000;
  solidas = [
    ...N.solidas.map(p => ({ ...p })),
    { x: -40, y: -500, w: 40, h: 1600, invisible: true },
    { x: mundoAncho, y: -500, w: 40, h: 1600, invisible: true },
  ];
  oneWays  = N.oneWays.map(p => ({ ...p }));
  monedas  = N.monedas.map((m, i) => ({ ...m, tomada: false, fase: i * 0.7 }));
  bloquesQ = N.bloquesQ.map(b => ({ ...b, w: 34, h: 34, usado: false, bump: 0 }));
  capacitores = N.capacitores.map(c => ({ ...c }));
  ventiladores = (N.ventiladores || []).map(v => ({ ...v }));
  enemigos = N.enemigos.map(e => ({ ...e, x0: e.x, vivo: true, lunge: 0, lungeT: 0, cooldown: 0,
                                    mordio: false, headY: e.y + 6, timer: 1 + Math.random(), telegraph: 0, disparo: 0, ang: 0,
                                    ciclo: 1.5 + Math.random() * 2, abierto: false, presa: false, paralizado: 0 }));
  portal = { x: N.portal.x, y: N.portal.y, r: N.portal.r, activo: N.portal.activo, succ: 0 };
  spider = N.spider ? { x: N.spider.x, y: N.spider.y, w: N.spider.w, h: N.spider.h,
                         hpMax: N.spider.hpMax, hp: N.spider.hpMax, xMin: N.spider.xMin, xMax: N.spider.xMax,
                         vivo: true, vx: 0, vy: 0, invuln: 0, saltoT: 1.4, despierto: false, paralizado: 0 } : null;
  dragon = N.dragon ? { x: N.dragon.x, y: N.dragon.y, w: N.dragon.w, h: N.dragon.h,
                         hpMax: N.dragon.hpMax, hp: N.dragon.hpMax, xMin: N.dragon.xMin, xMax: N.dragon.xMax,
                         baseY: N.dragon.y, vivo: true, invuln: 0, despierto: false, disparaT: 1.6,
                         fase: 'normal', teleT: 0, teleX: 0, teleCd: 3.5, aplastado: 0, paralizado: 0 } : null;
  cerebro = N.cerebro ? { x: N.cerebro.x, y: N.cerebro.y, w: N.cerebro.w, h: N.cerebro.h,
                           xMin: N.cerebro.xMin, xMax: N.cerebro.xMax,
                           baseY: N.cerebro.y, vivo: true, despierto: false,
                           forma: 'cerebro', formaT: CEREBRO_FORMA_T, disT: 2.4,
                           nodos: [], nucIdx: 0, invT: 0.5,
                           invocT: CEREBRO_INVOC_T, invocados: 0, paralizado: 0 } : null;
  if (cerebro) {
    for (let i = 0; i < NODOS_CEREBRO; i++) {
      const a = i / NODOS_CEREBRO * Math.PI * 2;
      cerebro.nodos.push({
        x: N.cerebro.x + N.cerebro.w / 2 + Math.cos(a) * 55,
        y: N.cerebro.y + N.cerebro.h / 2 + Math.sin(a) * 40,
        tx: 0, ty: 0, viva: true, wob: Math.random() * 6.28
      });
    }
  }
  frags.length = 0;
  fragsDrop.length = 0;
  absorcion = null;
  anuncio = null;
  bits.length = 0;
  rios = (N.rios || []).map(r => ({ ...r }));
  arcos = (N.arcos || []).map(a => ({ ...a }));
  cascada = !!N.cascada;
  tintePlat = N.tinte || '#2de2ff';
  monedasSalto.length = 0;
  baterias.length = 0;
  empOnda = 0;
  if (!reintentando) puntosBase = puntos;
  puntos = puntosBase;
  Object.assign(jugador, {
    x: N.spawnX, y: N.spawnY, vx: 0, vy: 0,
    enSuelo: false, enOneWay: false, enCorriente: false,
    coyoteTimer: 0, bufferTimer: 0, saltoActivo: false, dropTimer: 0,
    hp: 3, invuln: 0, escalaX: 1, escalaY: 1, mirando: 1, dustTimer: 0, fasePaso: 0, turnTimer: 0,
    bitAmmo: BIT_AMMO_MAX, bitTimer: 0, bitAng: 0,

    latigoModo: 'normal', latigoOx: 0, latigoOy: 0,
    overclockT: 0, glitchUsado: false
  });
  if (cargarNivel.testing) {
    jugador.tieneLatigo = n >= 2;
    jugador.tienePistola = n >= 4;
  }

  // 🛡️ VALIDADOR AUTOMÁTICO (v14.1): enemigos terrestres y capacitores
  //    deben tener suelo debajo — si no, se re-asientan solos
  const sueloBajo = (x, w) => {
    for (const p of solidas) {
      if (p.invisible || p.h < 40) continue;
      if (x >= p.x - 2 && x + w <= p.x + p.w + 2) return p.y;
    }
    return null;
  };
  for (const e of enemigos) {
    if (e.tipo === 'murcielago') continue;
    const sy = sueloBajo(e.x, e.w);
    if (sy !== null && Math.abs(e.y + e.h - sy) > 8) e.y = sy - e.h;
  }
  for (const c of capacitores) {
    const sy = sueloBajo(c.x, 38);
    if (sy !== null) c.y = sy;
  }

  musica.bpm = [108, 118, 124, 116, 122, 128, 126, 130, 132, 136][n] || 108;
  actualizarCamara(0, true);
}

function golpearBloque(b) {
  if (b.usado) { audio.aterrizaje(); return; }
  b.usado = true;
  b.bump = 1;
  if (b.tipo === 'moneda') {
    monedasSalto.push({ x: b.x + 7, y: b.y - 26, vy: -430, vida: 0.9 });
    monedasTomadas++;
    puntos += 10;
    audio.moneda();
    emitir(b.x + 17, b.y, 8, '#ffd700', { vida: 0.5, gravedad: 300, esparce: 140 });
  } else {
    baterias.push({ x: b.x + 2, y: b.y - 28, w: 30, h: 28, vx: 85, vy: 0, emerge: 0 });
    audio.powerup();
  }
}

function soltarFrags(e) {
  const nF = 1 + (Math.random() < 0.4 ? 1 : 0);
  for (let k = 0; k < nF; k++)
    fragsDrop.push({ x: e.x + e.w / 2 + (Math.random() - 0.5) * 14,
                     y: e.y + e.h / 2, vida: FRAG_VIDA,
                     ch: Math.random() < 0.5 ? '0' : '1', fase: Math.random() * 6.28 });
}

const cam = { x: 0, y: 0 };
function actualizarCamara(dt, snap = false) {
  const objetivoX = jugador.x + jugador.w / 2 - canvas.width / 2;
  const objetivoY = jugador.y + jugador.h / 2 - canvas.height / 2;
  if (snap) { cam.x = objetivoX; cam.y = objetivoY; }
  else {
    const t = Math.min(1, CAM_SUAVIZADO * dt);
    cam.x += (objetivoX - cam.x) * t;
    cam.y += (objetivoY - cam.y) * t;
  }
  cam.x = Math.max(0, Math.min(mundoAncho - canvas.width, cam.x));
  cam.y = Math.max(0, Math.min(MUNDO.alto - canvas.height, cam.y));
}

function colisiona(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ================= HELPERS =================
function rrectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fillRR(x, y, w, h, r, color) { ctx.fillStyle = color; rrectPath(x, y, w, h, r); ctx.fill(); }
function glowOn(color, blur = 10) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function glowOff() { ctx.shadowBlur = 0; }

const audio = {
  ctx: null, master: null, ruido: null, habilitado: true,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.habilitado ? 0.45 : 0;
    this.master.connect(this.ctx.destination);
    const len = Math.floor(this.ctx.sampleRate * 0.5);
    this.ruido = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.ruido.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },

  toggle() {
    this.habilitado = !this.habilitado;
    if (this.master) this.master.gain.value = this.habilitado ? 0.45 : 0;
  },

  tono(freq, dur, tipo, vol, when = 0, slideA = null) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = tipo;
    o.frequency.setValueAtTime(freq, t);
    if (slideA) o.frequency.exponentialRampToValueAtTime(slideA, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },

  golpe(when, dur = 0.05, vol = 0.08, freq = 7000) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const s = this.ctx.createBufferSource();
    s.buffer = this.ruido;
    const f = this.ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.05);
  },

  salto()      { this.tono(280, 0.2, 'square', 0.12, 0, 760); },
  aterrizaje() { this.tono(150, 0.08, 'triangle', 0.1, 0, 60); },

  caida()      { this.tono(300, 0.5, 'sawtooth', 0.12, 0, 40); },
  mordida()    { this.tono(180, 0.1, 'square', 0.14, 0, 60); this.tono(90, 0.15, 'sawtooth', 0.1, 0.05, 40); },
  powerup()    { this.tono(523, 0.1, 'square', 0.1); this.tono(659, 0.1, 'square', 0.1, 0.09); this.tono(784, 0.22, 'square', 0.1, 0.18); },

const musica = {
  bpm: 108, paso: 0, proximo: 0, timer: null,
  bajo:  [110.00, 87.31, 130.81, 98.00],
  arpeg: [
    [220.00, 261.63, 329.63],
    [174.61, 220.00, 261.63],
    [261.63, 329.63, 392.00],
    [196.00, 246.94, 293.66],
  ],

  iniciar() {
    if (!audio.ctx || this.timer) return;
    this.paso = 0;
    this.proximo = audio.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.programar(), 60);
  },

  programar() {
    if (!audio.ctx) return;
    if (this.proximo < audio.ctx.currentTime - 0.2) this.proximo = audio.ctx.currentTime + 0.05;
    const semicorchea = 60 / this.bpm / 4;
    while (this.proximo < audio.ctx.currentTime + 0.25) {
      const when = this.proximo - audio.ctx.currentTime;
      this.tocar(this.paso, when);
      this.paso = (this.paso + 1) % 64;
      this.proximo += semicorchea;
    }
  },

  tocar(p, when) {
    const compas = Math.floor(p / 16) % 4;
    const sb = p % 16;
    const root = this.bajo[compas];
    const acorde = this.arpeg[compas];

    if (sb % 4 === 0) audio.tono(150, 0.12, 'sine', 0.5, when, 42);
    if (sb % 4 === 2) audio.golpe(when, 0.04, 0.05, 8000);
    else if (sb % 2 === 1) audio.golpe(when, 0.02, 0.02, 9000);
    this.bajoNota(sb % 2 === 0 ? root : root * 2, when);
    if (sb % 2 === 0) {
      const secuencia = [0, 1, 2, 1];
      audio.tono(acorde[secuencia[(sb / 2) % 4]] * 2, 0.14, 'triangle', 0.045, when);
    }
    if (sb === 0) audio.tono(acorde[0] * 4, 0.5, 'triangle', 0.03, when);
  },

  bajoNota(freq, when) {
    if (!audio.ctx) return;
    const t = audio.ctx.currentTime + when;
    const o = audio.ctx.createOscillator();
    const f = audio.ctx.createBiquadFilter();
    const g = audio.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(freq, t);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(250, t + 0.12);
    f.Q.value = 8;
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(f); f.connect(g); g.connect(audio.master);
    o.start(t); o.stop(t + 0.18);
  }
};

// ================= PARTÍCULAS =================
const particulas = [];
function emitir(x, y, n, color, opts = {}) {
  for (let i = 0; i < n; i++) {
    const vida = (opts.vida || 0.5) * (0.7 + Math.random() * 0.6);
    particulas.push({
      x, y,
      vx: (Math.random() - 0.5) * (opts.esparce || 220),
      vy: (opts.vyMin ?? -120) + Math.random() * (opts.varVy || 100),
      vida, vidaMax: vida,
      tam: (opts.tam || 4) * (0.6 + Math.random() * 0.8),
      color,
      gravedad: opts.gravedad ?? 800
    });
  }
}
function actualizarParticulas(dt) {
  for (let i = particulas.length - 1; i >= 0; i--) {
    const p = particulas[i];
    p.vida -= dt;
    if (p.vida <= 0) { particulas.splice(i, 1); continue; }
    p.vy += p.gravedad * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

  emitir(jugador.x + jugador.w / 2, jugador.y + jugador.h / 2, 12, '#ff3860', { vida: 0.5 });

// 🧠 helpers de la Mente Enjambre
function nucleoCerebro() {
  if (!cerebro || !cerebro.vivo || !cerebro.despierto) return null;
  const n = cerebro.nodos[cerebro.nucIdx];
  if (!n || !n.viva) return null;
  return { x: n.x - 10, y: n.y - 10, w: 20, h: 20 };
}

function dañarCerebro() {
  const C = cerebro;
  if (!C || !C.vivo || !C.despierto || C.invT > 0) return;
  const n = C.nodos[C.nucIdx];
  if (!n || !n.viva) return;
  n.viva = false;
  C.invT = 0.6;
  puntos += 150;
  shake = 7;
  audio.stomp();
  emitir(n.x, n.y, 14, '#9d7dff', { vida: 0.7, esparce: 320 });
  let mejor = -1, mejorD = -1;
  const jx = jugador.x + jugador.w / 2;
  C.nodos.forEach((nd, i) => {
    if (!nd.viva) return;
    const d = Math.abs(nd.x - jx);
    if (d > mejorD) { mejorD = d; mejor = i; }
  });
  if (mejor < 0) {
    C.vivo = false;
    portal.activo = true;
    puntos += 500;
    shake = 14;
    audio.bossdown();
    mostrarAnuncio('★ ¡MENTE LIBERADA! ★', 'La red es libre — Compuboy, héroe');
    setTimeout(() => audio.obtenida(), 400);
  } else {
    C.nucIdx = mejor;
  }
}

  jugador.bitTimer = BIT_CADENCIA;
  bits.push({
    x: jugador.x + jugador.w / 2 + Math.cos(ang) * 18,
    y: jugador.y + jugador.h / 2 - 6 + Math.sin(ang) * 14,
    vx: Math.cos(ang) * BIT_VEL,
    vy: Math.sin(ang) * BIT_VEL,
    vida: BIT_VIDA,
    ch: (bits.length % 2) ? '0' : '1'
  });
  audio.bit();
  emitir(jugador.x + jugador.w / 2 + Math.cos(ang) * 20, jugador.y + jugador.h / 2 - 6 + Math.sin(ang) * 14,
         3, '#7df9ff', { vida: 0.2, gravedad: 0, esparce: 80, vyMin: -20, varVy: 40, tam: 2.5 });
  jugador.bitAng = ang;
}

// ================= UPDATE =================
function alMirar(d) {
  if (jugador.latigoT > 0) return;
  if (jugador.mirando === d) return;
  jugador.mirando = d;
  if (jugador.enSuelo && Math.abs(jugador.vx) > 40) jugador.turnTimer = 0.16;
}

function update(dt) {
  tiempo += dt;
  if (estado === 'jugando') tiempoJuego += dt;
  actualizarParticulas(dt);
  shake = Math.max(0, shake - 25 * dt);
  if (estado !== 'jugando') return;

  const izq      = teclas['ArrowLeft']  || teclas['KeyA'];
  const der      = teclas['ArrowRight'] || teclas['KeyD'];
  const abajo    = teclas['ArrowDown']  || teclas['KeyS'];
  // 🆕 v14.1: ESPACIO salta — ↑/W apuntan
  const saltando = teclas['Space'];

  if (izq && !der)  { jugador.vx -= ACELERACION * dt; alMirar(-1); }
  else if (der && !izq) { jugador.vx += ACELERACION * dt; alMirar(1); }
  else {
    if (Math.abs(jugador.vx) < VEL_MUERTA) jugador.vx = 0;
    if (jugador.vx > 0) jugador.vx = Math.max(0, jugador.vx - FRICCION * dt);
    else jugador.vx = Math.min(0, jugador.vx + FRICCION * dt);
  }
  const overMul = jugador.overclockT > 0 ? 1.45 : 1;
  jugador.vx = Math.max(-VEL_MAX * overMul, Math.min(VEL_MAX * overMul, jugador.vx));

  if (jugador.enSuelo && Math.abs(jugador.vx) > 10)
    jugador.fasePaso += Math.abs(jugador.vx) * dt * 0.05;

  jugador.coyoteTimer = jugador.enSuelo ? COYOTE_TIME : jugador.coyoteTimer - dt;
  if (saltando) jugador.bufferTimer = JUMP_BUFFER;
  else jugador.bufferTimer -= dt;

  if (abajo && jugador.enOneWay) {
    jugador.dropTimer = 0.25;
    jugador.enOneWay = false;
    jugador.enSuelo = false;
  }
  jugador.dropTimer = Math.max(0, jugador.dropTimer - dt);

  if (jugador.bufferTimer > 0 && jugador.coyoteTimer > 0) {
    jugador.vy = FUERZA_SALTO;
    jugador.bufferTimer = 0;
    jugador.coyoteTimer = 0;
    jugador.saltoActivo = true;
    jugador.enOneWay = false;
    jugador.glitchUsado = false;
    jugador.escalaX = 0.7; jugador.escalaY = 1.35;
    audio.salto();
    emitir(jugador.x + jugador.w / 2, jugador.y + jugador.h, 5, '#2de2ff',
           { vyMin: -40, varVy: 30, gravedad: 250, tam: 3, vida: 0.35, esparce: 120 });
  }

  if (!saltando && jugador.saltoActivo && jugador.vy < -60) {
    jugador.vy *= CORTE_SALTO;
    jugador.saltoActivo = false;
  }

  const g = jugador.vy < 0 ? GRAVEDAD : GRAVEDAD_CAIDA;
  jugador.vy = Math.min(jugador.vy + g * dt, VEL_MAX_CAIDA);

  // 🌀 FAN COOLERS
  const estabaEnCorriente = jugador.enCorriente;
  jugador.enCorriente = false;
  for (const v of ventiladores) {
    const dentroX = jugador.x + jugador.w > v.x + 6 && jugador.x < v.x + v.w - 6;
    const dentroY = jugador.y + jugador.h > v.y - v.altura && jugador.y + jugador.h < v.y + 6;
    if (dentroX && dentroY) {
      jugador.enCorriente = true;
      jugador.vy -= VENT_FUERZA * dt;
      if (jugador.vy < -VENT_VEL) jugador.vy = -VENT_VEL;
    }
  }
  if (jugador.enCorriente && !estabaEnCorriente) audio.viento();

  jugador.x += jugador.vx * dt;
  for (const p of solidas) {
    if (colisiona(jugador, p)) {
      if (jugador.vx > 0) jugador.x = p.x - jugador.w;
      else if (jugador.vx < 0) jugador.x = p.x + p.w;
      jugador.vx = 0;
    }
  }
  for (const b of bloquesQ) {
    if (colisiona(jugador, b)) {
      if (jugador.vx > 0) jugador.x = b.x - jugador.w;
      else if (jugador.vx < 0) jugador.x = b.x + b.w;
      jugador.vx = 0;
    }
  }

  const estabaEnSuelo = jugador.enSuelo;
  jugador.enSuelo = false;
  jugador.enOneWay = false;
  const prevBottom = jugador.y + jugador.h;
  jugador.y += jugador.vy * dt;

  let impacto = 0;
  for (const p of solidas) {
    if (colisiona(jugador, p)) {
      if (jugador.vy > 0) {
        impacto = Math.max(impacto, jugador.vy);
        jugador.y = p.y - jugador.h;
        jugador.vy = 0;
        jugador.enSuelo = true;
      } else if (jugador.vy < 0) {
        jugador.y = p.y + p.h;
        jugador.vy = 0;
      }
    }
  }
  for (const b of bloquesQ) {
    if (colisiona(jugador, b)) {
      if (jugador.vy > 0) {
        impacto = Math.max(impacto, jugador.vy);
        jugador.y = b.y - b.h;
        jugador.vy = 0;
        jugador.enSuelo = true;
      } else if (jugador.vy < 0) {
        jugador.y = b.y + b.h;
        jugador.vy = 0;
        golpearBloque(b);
      }
    }
  }

  if (jugador.vy > 0 && jugador.dropTimer <= 0) {
    for (const p of oneWays) {
      const solapaX = jugador.x + jugador.w > p.x && jugador.x < p.x + p.w;
      if (solapaX && prevBottom <= p.y && jugador.y + jugador.h >= p.y) {
        impacto = Math.max(impacto, jugador.vy);
        jugador.y = p.y - jugador.h;
        jugador.vy = 0;
        jugador.enSuelo = true;
        jugador.enOneWay = true;
      }
    }
  }

  if (jugador.enSuelo) jugador.glitchUsado = false;   // 🦘 glitch recargado

  if (!estabaEnSuelo && jugador.enSuelo && impacto > 150) {
    const fuerza = Math.min(1, impacto / VEL_MAX_CAIDA);
    jugador.escalaX = 1 + 0.35 * fuerza;
    jugador.escalaY = 1 - 0.35 * fuerza;
    audio.aterrizaje();
    emitir(jugador.x + jugador.w / 2, jugador.y + jugador.h,
           Math.round(3 + fuerza * 7), '#2de2ff',
           { vyMin: -60, varVy: 40, gravedad: 300, vida: 0.4, esparce: 160 });
  }

  jugador.escalaX += (1 - jugador.escalaX) * Math.min(1, 10 * dt);
  jugador.escalaY += (1 - jugador.escalaY) * Math.min(1, 10 * dt);
  jugador.invuln = Math.max(0, jugador.invuln - dt);
  jugador.turnTimer = Math.max(0, jugador.turnTimer - dt);

  if (jugador.enSuelo && Math.abs(jugador.vx) > 180) {
    jugador.dustTimer -= dt;
    if (jugador.dustTimer <= 0) {
      jugador.dustTimer = 0.09;
      emitir(jugador.x + jugador.w / 2 - jugador.mirando * 10, jugador.y + jugador.h,
             1, '#1a6fae', { vyMin: -30, varVy: 20, gravedad: 150, tam: 3, vida: 0.4, esparce: 60 });
    }
  }

  // --- enemigos: movimiento (paralizados congelados) ---
  for (const e of enemigos) {
    if (!e.vivo || e.presa) continue;
    if (e.paralizado > 0) { e.paralizado -= dt; continue; }
    if (e.tipo === 'bot') {
      e.x += e.vx * dt;
      if (e.x < e.xMin)      { e.x = e.xMin;       e.vx =  Math.abs(e.vx); }
      if (e.x + e.w > e.xMax){ e.x = e.xMax - e.w; e.vx = -Math.abs(e.vx); }
    } else if (e.tipo === 'murcielago') {
      e.x += e.vx * dt;
      if (e.x < e.xMin)      { e.x = e.xMin;       e.vx =  Math.abs(e.vx); }
      if (e.x + e.w > e.xMax){ e.x = e.xMax - e.w; e.vx = -Math.abs(e.vx); }
      e.y = e.baseY + Math.sin(tiempo * e.freq + e.fase) * e.amp;
    } else if (e.tipo === 'planta') {
      e.cooldown -= dt;
      e.headY = e.y + 6 - e.lunge * 48;
      if (e.lungeT > 0) {
        e.lungeT -= dt;
        const p = 1 - Math.max(0, e.lungeT) / 0.7;
        e.lunge = Math.sin(Math.min(1, p) * Math.PI);
        if (!e.mordio && p > 0.15) { e.mordio = true; audio.mordida(); }
        if (e.lungeT <= 0) e.cooldown = 1.3;
      } else if (e.cooldown <= 0) {
        const dx = Math.abs((jugador.x + jugador.w / 2) - (e.x + e.w / 2));
        if (dx < e.rango) { e.lungeT = 0.7; e.mordio = false; }
      }
    } else if (e.tipo === 'escorpion') {
      if (e.disparo > 0) {
        e.disparo -= dt;
        for (let d = 12; d < 430; d += 9) {
          const px = e.x + e.w - 4 + Math.cos(e.ang) * d;
          const py = e.y - 10 + Math.sin(e.ang) * d;
          if (colisiona(jugador, { x: px - 3, y: py - 3, w: 6, h: 6 })) { dañar(px); break; }
        }
      } else if (e.telegraph > 0) {
        e.telegraph -= dt;
        if (e.telegraph <= 0) { e.disparo = 0.28; audio.laser(); }
      } else {
        e.timer -= dt;
        e.x += e.vx * dt;
        if (e.x < e.xMin)      { e.x = e.xMin;       e.vx =  Math.abs(e.vx); }
        if (e.x + e.w > e.xMax){ e.x = e.xMax - e.w; e.vx = -Math.abs(e.vx); }
        if (e.timer <= 0) {
          const dx = (jugador.x + jugador.w / 2) - (e.x + e.w - 4);
          const dy = (jugador.y + jugador.h / 2) - (e.y - 10);
          e.ang = Math.atan2(dy, dx);
          e.telegraph = 0.65;
          e.timer = e.cadencia;
          audio.apuntar();
        }
      }
    } else if (e.tipo === 'disquete') {
      e.ciclo -= dt;
      if (e.abierto) {
        if (e.ciclo <= 0) { e.abierto = false; e.ciclo = 2 + Math.random() * 2; }
      } else {
        e.x += e.vx * dt;
        if (e.x < e.xMin)      { e.x = e.xMin;       e.vx =  Math.abs(e.vx); }
        if (e.x + e.w > e.xMax){ e.x = e.xMax - e.w; e.vx = -Math.abs(e.vx); }
        if (e.ciclo <= 0) { e.abierto = true; e.ciclo = 1.1; audio.floppy(); }
      }
    }
  }

  // --- enemigos: colisiones ---
  for (const e of enemigos) {
    if (!e.vivo || e.presa) continue;
    const box = e.tipo === 'planta' ? { x: e.x - 2, y: e.headY, w: e.w + 4, h: 26 } : e;
    if (!colisiona(jugador, box)) continue;
    if (jugador.vy > 0 && prevBottom <= box.y + 12) {
      e.vivo = false;
      jugador.vy = VEL_REBOTE;
      puntos += 50;
      shake = 4;
      audio.stomp();
      soltarFrags(e);
      const col = e.tipo === 'planta' ? '#39ff14' : e.tipo === 'murcielago' ? '#2de2ff' :
                  e.tipo === 'escorpion' ? '#ff3860' : e.tipo === 'disquete' ? '#7df9ff' : '#ff2fd6';
      emitir(box.x + box.w / 2, box.y + box.h / 2, 14, col, { vida: 0.6, esparce: 300 });
    } else {
      dañar(e.x + e.w / 2);
    }
  }

  // --- 🕷️ ARAÑA ---
  if (spider && spider.vivo && !(absorcion && absorcion.boss === spider)) {
    const S = spider;
    S.invuln = Math.max(0, S.invuln - dt);
    if (!S.despierto) {
      if (Math.abs((jugador.x + jugador.w / 2) - (S.x + S.w / 2)) < 380) {
        S.despierto = true;
        shake = 8;
        audio.boss();
      }
    } else if (S.paralizado > 0) {
      S.paralizado -= dt;
    } else {
      S.vy = Math.min(S.vy + GRAVEDAD * dt, VEL_MAX_CAIDA);
      S.x += S.vx * dt;
      S.x = Math.max(S.xMin, Math.min(S.xMax - S.w, S.x));
      S.y += S.vy * dt;
      let piso = false;
      for (const p of solidas) {
        if (colisiona(S, p) && S.vy > 0) { S.y = p.y - S.h; S.vy = 0; piso = true; }
      }
      if (piso) {
        S.vx *= 0.82;
        S.saltoT -= dt;
        if (S.saltoT <= 0) {
          S.vy = -730;
          S.vx = Math.sign(jugador.x - S.x || 1) * 200;
          S.saltoT = 1.4 + Math.random() * 0.5;
          audio.brinco();
        }
      }
      if (colisiona(jugador, S)) {
        if (jugador.vy > 0 && prevBottom <= S.y + 14) {
          jugador.vy = VEL_REBOTE;
          emitir(S.x + S.w / 2, S.y, 10, '#ff2fd6', { vida: 0.5, esparce: 250 });
          herirSpider();
        } else {
          dañar(S.x + S.w / 2);
        }
      }
    }
  }

  // --- 🦠 OJO BIÓNICO ---
  if (dragon && dragon.vivo && !(absorcion && absorcion.boss === dragon)) {
    const D = dragon;
    D.invuln = Math.max(0, D.invuln - dt);

    if (!D.despierto) {
      if (Math.abs((jugador.x + jugador.w / 2) - (D.x + D.w / 2)) < 500) {
        D.despierto = true; shake = 8; audio.dragonRugido();
      }
    } else if (D.fase === 'tele') {
      D.teleT -= dt;
      if (D.teleT <= 0) {
        D.x = D.teleX;
        D.fase = 'normal';
        D.disparaT = 1.0;
        D.invuln = 0.3;
        shake = 4;
        audio.warp();
      }
    } else {
      D.y = D.baseY + Math.sin(tiempo * 1.8) * 16;
      D.aplastado = Math.max(0, D.aplastado - dt);

      if (D.paralizado > 0) {
        D.paralizado -= dt;
      } else if (D.aplastado <= 0) {
        const dirD = Math.sign((jugador.x + jugador.w / 2) - (D.x + D.w / 2) || 1);
        D.x = Math.max(D.xMin, Math.min(D.xMax - D.w, D.x + dirD * 55 * dt));
        D.disparaT -= dt;
        if (D.disparaT <= 0) {
          D.disparaT = 2.2;
          const dx = (jugador.x + jugador.w / 2) - (D.x + D.w / 2);
          const dy = (jugador.y + jugador.h / 2) - (D.y + D.h / 2);
          const d = Math.hypot(dx, dy) || 1;
          frags.push({ x: D.x + D.w / 2, y: D.y + D.h / 2,
                       vx: dx / d * 250, vy: dy / d * 250, d: 0,
                       txt: FRAGMENTOS[Math.floor(Math.random() * FRAGMENTOS.length)] });
          audio.codigo();
        }
        D.teleCd -= dt;
        if (D.teleCd <= 0) {
          let tx = (jugador.x + jugador.w / 2) + (Math.random() < 0.5 ? -1 : 1) * (80 + Math.random() * 60);
          D.teleX = Math.max(D.xMin, Math.min(D.xMax - D.w, tx));
          D.fase = 'tele';
          D.teleT = OJO_TELE_T;
          audio.warp();
          D.teleCd = OJO_TELE_CD + Math.random() * 1.5;
        }
      }

      if (colisiona(jugador, D)) {
        if (jugador.vy > 0 && prevBottom <= D.y + 16) {
          herirDragon();
          jugador.vy = VEL_REBOTE;
          emitir(D.x + D.w / 2, D.y, 10, '#ff2fd6', { vida: 0.5, esparce: 250 });
        } else if (D.aplastado <= 0) {
          dañar(D.x + D.w / 2);
        }
      }
    }
  }

  // --- 🧠 MENTE ENJAMBRE ---
  if (cerebro && cerebro.vivo && !(absorcion && absorcion.boss === cerebro)) {
    const C = cerebro;
    C.invT = Math.max(0, C.invT - dt);
    C.paralizado = Math.max(0, C.paralizado - dt);

    if (!C.despierto) {
      if (Math.abs((jugador.x + jugador.w / 2) - (C.x + C.w / 2)) < 520) {
        C.despierto = true; shake = 10; audio.cerebroS();
      }
    } else {
      const cx0 = C.x + C.w / 2, cy0 = C.baseY + Math.sin(tiempo * 1.4) * 20;
      C.y = cy0;

      if (C.paralizado <= 0) {
        C.formaT -= dt;
        if (C.formaT <= 0) {
          const formas = ['cerebro', 'escudo', 'canon', 'enjambre'];
          C.forma = formas[Math.floor(Math.random() * formas.length)];
          C.formaT = CEREBRO_FORMA_T;
          audio.onda();
        }

        const lado = Math.sign((jugador.x + jugador.w / 2) - cx0 || 1);
        const n = C.nodos.length;
        for (let i = 0; i < n; i++) {
          const nd = C.nodos[i];
          if (!nd.viva) continue;
          const a0 = i / n * Math.PI * 2;
          let tx, ty;
          if (C.forma === 'cerebro') {
            tx = cx0 + Math.cos(a0) * 60; ty = cy0 + Math.sin(a0) * 42;
          } else if (C.forma === 'escudo') {
            tx = cx0 + lado * 48 + (i % 2 ? 14 : -8); ty = cy0 - 58 + (i / (n - 1)) * 116;
          } else if (C.forma === 'canon') {
            tx = cx0 + lado * (26 + (i % 5) * 27); ty = cy0 - 32 + Math.floor(i / 5) * 36;
          } else {
            tx = cx0 + Math.cos(a0 + tiempo * 0.3) * 95; ty = cy0 + Math.sin(a0 + tiempo * 0.3) * 70;
          }
          if (i === C.nucIdx) {
            if (C.forma === 'escudo')      { tx = cx0 - lado * 18; ty = cy0; }
            else if (C.forma === 'canon')  { tx = cx0 + lado * 118; ty = cy0; }
            else if (C.forma === 'cerebro'){ tx = cx0; ty = cy0 - 10; }
          }
          nd.tx = tx + Math.sin(tiempo * 2.2 + nd.wob) * 4;
          nd.ty = ty + Math.cos(tiempo * 1.9 + nd.wob) * 4;
          nd.x += (nd.tx - nd.x) * Math.min(1, 3 * dt);
          nd.y += (nd.ty - nd.y) * Math.min(1, 3 * dt);
        }

        if (C.forma === 'canon' || C.forma === 'cerebro') {
          if (!C.disT) C.disT = 2.4;
          C.disT -= dt;
          if (C.disT <= 0) {
            C.disT = C.forma === 'canon' ? 1.8 : 3.2;
            const nb = nucleoCerebro();
            const dx0 = (jugador.x + jugador.w / 2) - nb.x;
            const dy0 = (jugador.y + jugador.h / 2) - nb.y;
            const d0 = Math.hypot(dx0, dy0) || 1;
            if (C.forma === 'canon') {
              frags.push({ x: nb.x, y: nb.y, vx: dx0 / d0 * 250, vy: dy0 / d0 * 250, d: 0,
                           txt: FRAGMENTOS[Math.floor(Math.random() * FRAGMENTOS.length)] });
            } else {
              for (let k = -1; k <= 1; k++) {
                const dx2 = dx0 + k * 90, dy2 = dy0;
                const d2 = Math.hypot(dx2, dy2) || 1;
                frags.push({ x: nb.x, y: nb.y, vx: dx2 / d2 * 250, vy: dy2 / d2 * 250, d: 0,
                             txt: FRAGMENTOS[Math.floor(Math.random() * FRAGMENTOS.length)] });
              }
            }
            audio.onda();
          }
        } else C.disT = 2.4;

        if (C.forma === 'enjambre' && C.invocados < 5) {
          C.invocT -= dt;
          if (C.invocT <= 0) {
            C.invocT = CEREBRO_INVOC_T;
            C.invocados++;
            const nodoSpawn = C.nodos.find(nd => nd.viva);
            invocarEnemigo(Math.random() < 0.5 ? 'murcielago' : 'bot', nodoSpawn.x, nodoSpawn.y);
          }
        }
      }

      const nb = nucleoCerebro();
      if (nb && colisiona(jugador, nb) && jugador.vy > 0 && prevBottom <= nb.y + 12) {
        dañarCerebro();
        jugador.vy = VEL_REBOTE;
      }
    }
  }

  // --- 🍽️ drenaje de jefe absorbido ---
  if (absorcion) {
    absorcion.t -= dt;
    const b = absorcion.boss;
    const cxJ = jugador.x + jugador.w / 2, cyJ = jugador.y + jugador.h / 2;
    const dxJ = cxJ - (b.x + b.w / 2), dyJ = cyJ - (b.y + b.h / 2);
    const dJ = Math.hypot(dxJ, dyJ) || 1;
    b.x += dxJ / dJ * 140 * dt;
    b.y += dyJ / dJ * 140 * dt;
    if (absorcion.tipo === 'cerebro') {
      for (const nd of b.nodos) if (nd.viva) {
        nd.x += dxJ / dJ * 140 * dt;
        nd.y += dyJ / dJ * 140 * dt;
      }
    }
    if (Math.random() < 0.6)
      emitir(b.x + b.w / 2, b.y + b.h / 2, 2, '#39ff14', { vida: 0.4, esparce: 100, gravedad: 0 });
    if (absorcion.t <= 0) finalizarAbsorcion();
  }

  // --- 💻 fragmentos del Ojo: crecen, se desvanecen, mueren a 280px ---
  for (let i = frags.length - 1; i >= 0; i--) {
    const f = frags[i];
    f.d += 250 * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    const k = Math.max(0, 1 - f.d / FRAG_DIST);
    const esc = 0.55 + 0.95 * (1 - k);
    if (colisiona(jugador, { x: f.x - 15 * esc, y: f.y - 9 * esc, w: 30 * esc, h: 18 * esc })) {
      dañar(f.x);
      frags.splice(i, 1);
      continue;
    }
    if (k <= 0) frags.splice(i, 1);
  }

  // --- monedas ---
  for (const m of monedas) {
    if (m.tomada) continue;
    if (colisiona(jugador, { x: m.x, y: m.y, w: 20, h: 20 })) {
      m.tomada = true;
      monedasTomadas++;
      puntos += 10;
      audio.moneda();
      emitir(m.x + 10, m.y + 10, 10, '#ffd700', { vida: 0.5, gravedad: 200, esparce: 180, vyMin: -150 });
    }
  }

  // --- bloques, monedas de salto y baterías ---
  for (const b of bloquesQ) b.bump = Math.max(0, b.bump - dt * 4);
  for (let i = monedasSalto.length - 1; i >= 0; i--) {
    const m = monedasSalto[i];
    m.vida -= dt;
    m.vy += 1500 * dt;
    m.y += m.vy * dt;
    if (m.vida <= 0) monedasSalto.splice(i, 1);
  }
  for (let i = baterias.length - 1; i >= 0; i--) {
    const h = baterias[i];
    if (h.emerge < 1) { h.emerge += dt * 1.6; continue; }
    h.vy = Math.min(h.vy + GRAVEDAD * dt, VEL_MAX_CAIDA);
    h.x += h.vx * dt;
    for (const p of solidas) {
      if (colisiona(h, p)) {
        if (h.vx > 0) h.x = p.x - h.w; else h.x = p.x + p.w;
        h.vx = -h.vx;
      }
    }
    h.y += h.vy * dt;
    for (const p of solidas) {
      if (colisiona(h, p) && h.vy > 0) { h.y = p.y - h.h; h.vy = 0; }
    }
    if (colisiona(jugador, h)) {
      baterias.splice(i, 1);
      puntos += 100;
      if (jugador.hp < 3) jugador.hp++;
      audio.powerup();
      emitir(h.x + 15, h.y + 14, 12, '#39ff14', { vida: 0.6, esparce: 200 });
      continue;
    }
    if (h.y > MUNDO.alto + 100) baterias.splice(i, 1);
  }

  // --- 🛡️ ESCUDO FIREWALL ---
  if (jugador.escudo) {
    jugador.code -= SHIELD_COSTE * dt;
    escudoFlash = Math.max(0, escudoFlash - dt * 3);
    if (jugador.code <= 0) {
      jugador.code = 0;
      jugador.escudo = false;
      audio.aterrizaje();
    }
  }

  // --- 💻 pickups de código ---
  for (let i = fragsDrop.length - 1; i >= 0; i--) {
    const f = fragsDrop[i];
    f.vida -= dt;
    f.y += 60 * dt;
    const dJ = Math.hypot((jugador.x + 16) - f.x, (jugador.y + 16) - f.y);
    if (dJ < FRAG_IMAN) {
      f.x += (jugador.x + 16 - f.x) * 6 * dt;
      f.y += (jugador.y + 16 - f.y) * 6 * dt;
    }
    if (dJ < 20) {
      fragsDrop.splice(i, 1);
      jugador.code = Math.min(CODE_MAX, jugador.code + FRAG_VALOR);
      audio.frag();
      emitir(f.x, f.y, 4, '#39ff14', { vida: 0.3, gravedad: 0, esparce: 60 });
      continue;
    }
    if (f.vida <= 0) fragsDrop.splice(i, 1);
  }

  // --- ⚡🦘🏃 PODERES DE CÓDIGO ---
  if (teclas['KeyB'] && jugador.tieneLatigo && jugador.code >= EMP_COSTE) {
    teclas['KeyB'] = false;
    jugador.code -= EMP_COSTE;
    audio.emp(); shake = 8;
    empOnda = 1;
    const cx0 = jugador.x + jugador.w / 2;
    for (const e of enemigos)
      if (e.vivo && Math.hypot((e.x + e.w / 2) - cx0, (e.y - jugador.y)) < EMP_RADIO) e.paralizado = EMP_T;
    if (spider && spider.vivo && spider.despierto && Math.abs((spider.x + spider.w / 2) - cx0) < EMP_RADIO) spider.paralizado = EMP_T;
    if (dragon && dragon.vivo && dragon.despierto && dragon.fase !== 'tele' && Math.abs((dragon.x + dragon.w / 2) - cx0) < EMP_RADIO) dragon.paralizado = EMP_T;
    if (cerebro && cerebro.vivo && cerebro.despierto && Math.abs((cerebro.x + cerebro.w / 2) - cx0) < EMP_RADIO) cerebro.paralizado = EMP_T;
  }
  if (jugador.bufferTimer > 0 && !jugador.enSuelo && jugador.coyoteTimer <= 0 &&
      !jugador.glitchUsado && jugador.code >= GLITCH_COSTE && jugador.latigoT <= 0) {
    jugador.bufferTimer = 0;
    jugador.code -= GLITCH_COSTE;
    jugador.glitchUsado = true;
    jugador.vy = FUERZA_SALTO * 0.92;
    jugador.saltoActivo = true;
    audio.glitchJ();
    emitir(jugador.x + 16, jugador.y + jugador.h, 10, '#ff2fd6', { vida: 0.4, esparce: 220, gravedad: 100 });
  }
  if (teclas['KeyG'] && jugador.tieneLatigo && jugador.code >= OVER_COSTE && jugador.overclockT <= 0) {
    teclas['KeyG'] = false;
    jugador.code -= OVER_COSTE;
    jugador.overclockT = OVER_T;
    audio.over();
  }
  if (jugador.overclockT > 0) jugador.overclockT -= dt;

  // --- 🔗 LÁTIGO (X): 6 direcciones — ↑ apunta ---
  if (jugador.tieneLatigo && teclas['KeyX'] && jugador.latigoT <= 0 && !absorcion) {
    const arriba = teclas['ArrowUp'] || teclas['KeyW'];
    const abajoT = abajo && !jugador.enSuelo;
    jugador.latigoT = LATIGO_DUR * (arriba ? 1.3 : 1);
    jugador.latigoAncla = null;
    jugador.latigoPresa = null;
    jugador.latigoRico = false;
    if (arriba) {
      jugador.latigoModo = 'tiro';
      jugador.latigoAng = (izq) ? -2.35 : (der) ? -0.78 : -1.57;
      jugador.vy = LATIGO_COLGAR;
    } else if (abajoT) {
      jugador.latigoModo = 'tiro';
      jugador.latigoAng = (izq) ? 2.35 : (der) ? 0.78 : (jugador.mirando > 0 ? 0.5 : 2.64);
    } else {
      jugador.latigoModo = 'normal';
      jugador.latigoAng = jugador.mirando > 0 ? 0 : Math.PI;
    }
    audio.latigo();
  }

  if (jugador.latigoT > 0) {
    jugador.latigoT = Math.max(0, jugador.latigoT - dt);
    const durTotal = LATIGO_DUR * (jugador.latigoModo === 'tiro' ? 1.3 : 1);
    const p = 1 - jugador.latigoT / durTotal;
    const maxL = jugador.latigoModo === 'tiro' ? LATIGO_LARGO * LATIGO_TIRO : LATIGO_LARGO;
    const ext = Math.min(1, p / 0.45) * maxL;
    const ang = jugador.latigoAng;

    const agachadoW = jugador.enSuelo && abajo && jugador.latigoModo !== 'tiro' && jugador.dropTimer <= 0;
    const adv = 2;
    jugador.latigoOx = jugador.x + jugador.w / 2 + 16 * jugador.mirando + Math.cos(jugador.latigoAng) * adv;
    jugador.latigoOy = jugador.y + jugador.h + (agachadoW ? -12 : -42) + 1 + Math.sin(jugador.latigoAng) * adv;
    const ox = jugador.latigoOx, oy = jugador.latigoOy;

    if (jugador.latigoModo === 'tiro' && jugador.latigoAng < 0) {
      if (!jugador.latigoAncla) {
        const gUsada = jugador.vy < 0 ? GRAVEDAD : GRAVEDAD_CAIDA;
        jugador.vy += (LATIGO_GRAV - gUsada) * dt;
      } else {
        const dxJ = jugador.latigoAncla.x - (jugador.x + jugador.w / 2);
        const dyJ = jugador.latigoAncla.y - (jugador.y + jugador.h / 2);
        const dJ = Math.hypot(dxJ, dyJ) || 1;
        jugador.vx = dxJ / dJ * LATIGO_TIRON;
        jugador.vy = dyJ / dJ * LATIGO_TIRON;
        jugador.enSuelo = false;
        if (dJ < 30) {
          jugador.latigoT = 0;
          jugador.vx *= 0.45;
          jugador.vy = Math.min(jugador.vy, -140);
        }
      }
    }

    if (jugador.latigoPresa) {
      const e = jugador.latigoPresa;
      if (!e.vivo) { jugador.latigoPresa = null; }
      else {
        const cxJ = jugador.x + jugador.w / 2, cyJ = jugador.y + jugador.h / 2;
        const dxJ = cxJ - (e.x + e.w / 2), dyJ = cyJ - (e.y + e.h / 2);
        const dJ = Math.hypot(dxJ, dyJ) || 1;
        e.x += dxJ / dJ * VEL_ATRAE * dt;
        e.y += dyJ / dJ * VEL_ATRAE * dt;
        if (dJ < 26) {
          e.vivo = false; e.presa = false;
          jugador.latigoPresa = null;
          jugador.code = Math.min(CODE_MAX, jugador.code + 25);
          puntos += 75;
          audio.comer();
          emitir(cxJ, cyJ, 16, '#39ff14', { vida: 0.6, esparce: 260, gravedad: 300 });
        }
      }
    }

    if (!jugador.latigoPresa && !jugador.latigoAncla && p < 0.5) {
      for (let d = 14; d <= ext; d += 7) {
        const px = ox + Math.cos(ang) * d;
        const py = oy + Math.sin(ang) * d;
        const pt = { x: px - 4, y: py - 4, w: 8, h: 8 };
        let tocado = false;

        for (const pl of solidas) {
          if (colisiona(pt, pl)) { jugador.latigoAncla = { x: px, y: py }; tocado = true; break; }
        }
        if (!tocado) for (const b of bloquesQ) {
          if (!b.usado && colisiona(pt, b)) {
            golpearBloque(b);
            jugador.latigoAncla = { x: px, y: py };
            tocado = true; break;
          }
        }
        if (!tocado && jugador.latigoModo === 'normal') {
          for (const e of enemigos) {
            if (!e.vivo || e.presa) continue;
            const box = e.tipo === 'planta' ? { x: e.x - 2, y: e.headY, w: e.w + 4, h: 26 } : e;
            if (!colisiona(pt, box)) continue;
            e.presa = true;
            jugador.latigoPresa = e;
            audio.ric();
            tocado = true; break;
          }
          if (!tocado && spider && spider.vivo && spider.despierto && colisiona(pt, spider)) {
            if (spider.hp <= 1) iniciarAbsorcion(spider, 'spider');
            else herirSpider();
            jugador.latigoAncla = { x: px, y: py }; tocado = true;
          }
          if (!tocado && dragon && dragon.vivo && dragon.despierto && dragon.fase !== 'tele' && colisiona(pt, dragon)) {
            if (dragon.hp <= 1) iniciarAbsorcion(dragon, 'dragon');
            else herirDragon();
            jugador.latigoAncla = { x: px, y: py }; tocado = true;
          }
          if (!tocado) {
            const nb = nucleoCerebro();
            if (nb && colisiona(pt, nb)) {
              const vivos = cerebro.nodos.filter(nd => nd.viva).length;
              if (vivos <= 1) iniciarAbsorcion(cerebro, 'cerebro');
              else dañarCerebro();
              jugador.latigoAncla = { x: px, y: py }; tocado = true;
            }
          }
        } else if (!tocado && jugador.latigoModo === 'tiro') {
          for (const e of enemigos) {
            if (!e.vivo || e.presa) continue;
            const box = e.tipo === 'planta' ? { x: e.x - 2, y: e.headY, w: e.w + 4, h: 26 } : e;
            if (!colisiona(pt, box)) continue;
            jugador.latigoAncla = { x: px, y: py }; tocado = true; break;
          }
          if (!tocado && spider && spider.vivo && spider.despierto && colisiona(pt, spider)) {
            jugador.latigoAncla = { x: px, y: py }; tocado = true;
          }
          if (!tocado && dragon && dragon.vivo && dragon.despierto && dragon.fase !== 'tele' && colisiona(pt, dragon)) {
            jugador.latigoAncla = { x: px, y: py }; tocado = true;
          }
        }
        if (tocado) break;
      }
      if (!jugador.latigoPresa && !jugador.latigoAncla && p >= 0.5) {
        jugador.latigoAncla = { x: ox + Math.cos(ang) * maxL, y: oy + Math.sin(ang) * maxL, aire: true };
      }
    }

    if (jugador.latigoT <= 0) {
      if (jugador.latigoPresa) { jugador.latigoPresa.presa = false; jugador.latigoPresa.vivo = true; jugador.latigoPresa = null; }
      jugador.latigoAncla = null;
      jugador.latigoModo = 'normal';
    }
  }

  // 🔫 pistola láser (C): 8 DIRECCIONES con ↑ apuntando
  jugador.bitTimer = Math.max(0, jugador.bitTimer - dt);
  if (jugador.tienePistola) jugador.bitAmmo = Math.min(BIT_AMMO_MAX, jugador.bitAmmo + dt / BIT_RECARGA);
  if (jugador.tienePistola && teclas['KeyC'] && jugador.bitTimer <= 0 && jugador.bitAmmo >= 1) {
    const base = jugador.mirando > 0 ? 0 : Math.PI;
    const upA = teclas['ArrowUp'] || teclas['KeyW'];
    let ang;
    if (upA && (izq || der))      ang = base === 0 ? -0.78 : Math.PI + 0.78;  // ↗ ↖
    else if (upA)                 ang = -Math.PI / 2;                          // ↑ recto arriba
    else if (abajo && !jugador.enSuelo)
                                  ang = base === 0 ? 0.78 : Math.PI - 0.78;    // ↘ ↙ (aire)
    else                          ang = base;                                  // → ←
    dispararBit(ang);
  }

  // 🔫 bits: movimiento y colisiones
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.vida -= dt;
    b.x += b.vx * dt;
    b.y += (b.vy || 0) * dt;   // trayectoria diagonal/vertical
    let muerto = b.vida <= 0;
    if (!muerto) for (const p of solidas) {
      if (colisiona({ x: b.x - 4, y: b.y - 8, w: 8, h: 12 }, p)) { muerto = true; break; }
    }
    if (!muerto && spider && spider.vivo && spider.despierto &&
        colisiona({ x: b.x - 4, y: b.y - 10, w: 8, h: 14 }, spider)) {
      muerto = true;
      herirSpider();
    }
    if (!muerto && dragon && dragon.vivo && dragon.despierto && dragon.fase !== 'tele' &&
        colisiona({ x: b.x - 4, y: b.y - 10, w: 8, h: 14 }, dragon)) {
      muerto = true;
      herirDragon();
    }
    if (!muerto) {
      const nb = nucleoCerebro();
      if (nb && colisiona({ x: b.x - 4, y: b.y - 10, w: 8, h: 14 }, nb)) {
        muerto = true;
        dañarCerebro();
      }
    }
    if (!muerto) for (const e of enemigos) {
      if (!e.vivo || e.presa) continue;
      const box = e.tipo === 'planta' ? { x: e.x - 2, y: e.headY, w: e.w + 4, h: 26 } : e;
      if (!colisiona({ x: b.x - 4, y: b.y - 10, w: 8, h: 14 }, box)) continue;
      if (e.tipo === 'disquete' && !e.abierto) {
        audio.ric();
        emitir(b.x, b.y - 5, 4, '#7df9ff', { vida: 0.3, gravedad: 400, esparce: 160 });
      } else {
        e.vivo = false;
        puntos += 50;
        audio.stomp();
        soltarFrags(e);
        emitir(e.x + e.w / 2, e.y + e.h / 2, 12, '#7df9ff', { vida: 0.5, esparce: 280 });
      }
      muerto = true;
      break;
    }
    if (muerto) bits.splice(i, 1);
  }

  // --- 🌀 PORTAL ---
  if (portal.activo) {
    const dxP = (jugador.x + jugador.w / 2) - portal.x;
    const dyP = (jugador.y + jugador.h / 2) - portal.y;
    const dP = Math.hypot(dxP, dyP);
    const objetivo = dP < 300 ? 1 - dP / 300 : 0;
    portal.succ += (objetivo - portal.succ) * Math.min(1, 5 * dt);
    if (dP < 220) jugador.vx -= Math.sign(dxP || 1) * 260 * portal.succ * dt;
    if (dP < 34) {
      if (nivelActivo < NIVELES.length - 1) {
        transNivel = nivelActivo + 1;
        estado = 'transicion';
        transT = 2.1;
        audio.portal();
      } else {
        ganar();
      }
      return;
    }
  }

  jugador.x = Math.max(0, Math.min(mundoAncho - jugador.w, jugador.x));
  if (jugador.y > MUNDO.alto + 100) {
    caidas++;
    jugador.hp--;
    if (jugador.hp <= 0) { morir(); return; }
    audio.caida();
    const N = NIVELES[nivelActivo];
    jugador.x = N.spawnX; jugador.y = N.spawnY;
    jugador.vx = 0; jugador.vy = 0;
    jugador.invuln = DURACION_INVULN;
    actualizarCamara(0, true);
  }
}

// ================================================================
//  🌌 FONDO SYNTHWAVE
// ================================================================
function dibujarLluviaCapa(L) {
  const cf = RAIN_CONF[L];
  ctx.globalAlpha = cf.alpha;
  for (const c of rain) {
    if (c.L !== L) continue;
    const sx = ((c.x - cam.x * cf.par) % 4600 + 4600) % 4600;
    if (sx > canvas.width + 24) continue;
    const y0 = ((tiempo * cf.vel + c.off) % 720) - 130;
    const vari = TIRAS[L][(c.idx + Math.floor(tiempo * 1.5 + c.off)) % 3];
    ctx.drawImage(vari, sx, y0);
  }
  ctx.globalAlpha = 1;
}

function dibujarFondo() {
  const cs = CIELOS[nivelActivo] || CIELOS[0];
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, cs[0]);
  sky.addColorStop(0.55, cs[1]);
  sky.addColorStop(0.8, cs[2]);
  sky.addColorStop(1, cs[3]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const s of estrellas) {
    const sx = ((s.x - cam.x * 0.15) % 4200 + 4200) % 4200;
    if (sx > canvas.width + 5) continue;
    ctx.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(tiempo * 0.8 + s.f));
    ctx.fillStyle = '#cfe8ff';
    ctx.fillRect(sx, s.y - cam.y * 0.1, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = 'rgba(45,226,255,0.22)';
  ctx.lineWidth = 1;
  for (const pts of constels) {
    ctx.beginPath();
    let started = false;
    for (const p of pts) {
      const px = ((p.x - cam.x * 0.15) % 4200 + 4200) % 4200;
      if (!started) { ctx.moveTo(px, p.y - cam.y * 0.1); started = true; }
      else ctx.lineTo(px, p.y - cam.y * 0.1);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(160,235,255,0.5)';
    for (const p of pts) {
      const px = ((p.x - cam.x * 0.15) % 4200 + 4200) % 4200;
      ctx.fillRect(px - 1, p.y - cam.y * 0.1 - 1, 2.5, 2.5);
    }
  }

  dibujarLluviaCapa(0);
  dibujarLluviaCapa(1);
  dibujarLluviaCapa(2);

  if (nivelActivo === 4) {
    const cx5 = 1450 - cam.x * 0.5;
    if (cx5 > -60 && cx5 < canvas.width + 60) {
      ctx.font = '10px monospace';
      for (let k = 0; k < 14; k++) {
        const yy = ((k * 34 + tiempo * 130) % 480) - 40;
        ctx.globalAlpha = 0.5 - (k % 4) * 0.08;
        ctx.fillStyle = '#7df9ff';
        ctx.fillText((k + Math.floor(tiempo * 4)) % 2 ? '1' : '0', cx5 + ((k % 3) - 1) * 14, yy + 60);
      }
      ctx.globalAlpha = 1;
    }
  }
  if (nivelActivo === 5) {
    const cxx = 2900 - cam.x * 0.55;
    if (cxx > -200 && cxx < canvas.width + 200) {
      glowOn('#2de2ff', 10);
      ctx.strokeStyle = 'rgba(45,226,255,0.6)';
      ctx.lineWidth = 1.5;
      const cy0 = 320 - cam.y * 0.2;
      ctx.strokeRect(cxx - 60, cy0 - 40, 120, 90);
      ctx.strokeRect(cxx - 20, cy0 - 75, 40, 50);
      for (let i = 0; i < 3; i++) ctx.strokeRect(cxx - 14 + i * 11, cy0 - 83, 7, 8);
      ctx.beginPath();
      ctx.moveTo(cxx - 20, cy0 - 40); ctx.lineTo(cxx, cy0 - 62); ctx.lineTo(cxx + 20, cy0 - 40);
      ctx.stroke();
      glowOff();
    }
  }

  // 🏙️ nivel 7: sol de datos + EDIFICIOS-MONITOR sonrientes
  if (nivelActivo === 6) {
    const solX = 2000 - cam.x * 0.4, solY = 250 - cam.y * 0.3;
    if (solX > -100 && solX < canvas.width + 100) {
      glowOn('#ffd27d', 20);
      ctx.fillStyle = '#ffb347';
      ctx.beginPath(); ctx.arc(solX, solY, 46, 0, Math.PI * 2); ctx.fill();
      glowOff();
      ctx.fillStyle = cs[1];
      for (let k = 0; k < 4; k++) ctx.fillRect(solX - 50, solY + 8 + k * 10, 100, 3 + k);
      ctx.strokeStyle = 'rgba(255,47,214,0.4)'; ctx.lineWidth = 1.5;
      for (let k = 0; k < 7; k++) {
        ctx.beginPath();
        ctx.moveTo(solX, solY);
        ctx.lineTo(solX + Math.cos(k * 0.9 - 0.6) * 130, solY + Math.sin(k * 0.9 - 0.6) * 130);
        ctx.stroke();
      }
    }
    for (const [tx, ty] of [[300, 140], [1050, 100], [1900, 130]]) {
      const bx = tx - cam.x * 0.5;
      if (bx < -90 || bx > canvas.width + 90) continue;
      ctx.fillStyle = '#1b1636';
      ctx.fillRect(bx + 10, ty + 70, 70, 220);
      fillRR(bx, ty, 90, 75, 8, '#d8e6d8');
      ctx.fillStyle = '#1a2a1a';
      rrectPath(bx + 8, ty + 8, 74, 56, 5); ctx.fill();
      ctx.fillStyle = '#9be8b0';
      ctx.fillRect(bx + 26, ty + 24, 10, 12);
      ctx.fillRect(bx + 54, ty + 24, 10, 12);
      ctx.fillRect(bx + 30, ty + 48, 30, 5);
      ctx.fillRect(bx + 24, ty + 44, 6, 4); ctx.fillRect(bx + 60, ty + 44, 6, 4);
      ctx.font = '9px monospace'; ctx.fillStyle = 'rgba(155,232,176,0.5)';
      for (let k = 0; k < 4; k++) ctx.fillText('1011', bx + 14, ty + 100 + k * 12);
    }
  }
  // 🏭 nivel 8: ventiladores industriales de pared
  if (nivelActivo === 7) {
    for (const [vx2, vy2] of [[200, 150], [1300, 170], [2500, 150]]) {
      const bx = vx2 - cam.x * 0.55;
      if (bx < -70 || bx > canvas.width + 70) continue;
      const by = vy2 - cam.y * 0.3;
      ctx.strokeStyle = '#24485c'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(bx, by, 52, 0, Math.PI * 2); ctx.stroke();
      ctx.save(); ctx.translate(bx, by); ctx.rotate(tiempo * 2.2);
      ctx.fillStyle = '#1a3a4a';
      for (let k = 0; k < 5; k++) {
        ctx.rotate(Math.PI * 2 / 5);
        ctx.beginPath(); ctx.ellipse(0, -26, 9, 24, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      glowOn('#39ff14', 6);
      ctx.fillStyle = 'rgba(57,255,20,0.6)';
      ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2); ctx.fill();
      glowOff();
    }
  }
  // ⌨️ nivel 9: teclado gigante
  if (nivelActivo === 8) {
    const bx = 700 - cam.x * 0.5;
    if (bx > -260 && bx < canvas.width + 60) {
      const by = 160 - cam.y * 0.3;
      ctx.fillStyle = '#221436';
      ctx.fillRect(bx, by, 240, 150);
      ctx.fillStyle = '#3a2a56';
      for (let r2 = 0; r2 < 4; r2++)
        for (let k = 0; k < 10; k++)
          ctx.fillRect(bx + 12 + k * 22.5, by + 12 + r2 * 34, 18, 26);
      ctx.fillStyle = '#ff9a5a';
      ctx.fillRect(bx + 12, by + 12, 18, 26);
    }
  }
  // 🧠 nivel 10: EL CEREBRO gigante al fondo
  if (nivelActivo === 9) {
    const bx = 1900 - cam.x * 0.45;
    if (bx > -180 && bx < canvas.width + 180) {
      const by = 180 - cam.y * 0.3;
      const despiertoBg = cerebro && cerebro.despierto && cerebro.vivo;
      const pulso = despiertoBg ? 1 + 0.07 * Math.sin(tiempo * 8) : 1 + 0.04 * Math.sin(tiempo * 3);
      glowOn('#9d7dff', 22);
      ctx.strokeStyle = despiertoBg ? 'rgba(255,56,96,0.7)' : 'rgba(157,125,255,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(bx, by, 85 * pulso, 62 * pulso, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(45,226,255,0.7)';
      ctx.beginPath();
      ctx.ellipse(bx, by, 68 * pulso, 48 * pulso, 0, 0, Math.PI * 2);
      ctx.stroke();
      for (let k = 0; k < 8; k++) {
        const a = k * 0.8 + tiempo * 0.15;
        ctx.beginPath();
        ctx.arc(bx + Math.cos(a) * 40, by + Math.sin(a) * 26, 14 + (k % 3) * 5, a, a + 2);
        ctx.stroke();
      }
      ctx.fillStyle = '#d0c0ff';
      for (let k = 0; k < 10; k++) {
        const a = k * 1.7 + tiempo * 0.3;
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(tiempo * 4 + k);
        ctx.beginPath();
        ctx.arc(bx + Math.cos(a) * 55, by + Math.sin(a) * 38, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      glowOff();
    }
  }

  const HY = 330 - cam.y * 0.25;

  ctx.lineWidth = 1.2;
  for (const m of montanas) {
    const mx = m.x - cam.x * 0.28;
    if (mx + m.w < 0 || mx > canvas.width) continue;
    const pico = HY - m.h;
    ctx.strokeStyle = 'rgba(255,47,214,0.4)';
    ctx.beginPath();
    ctx.moveTo(mx, HY); ctx.lineTo(mx + m.w / 2, pico); ctx.lineTo(mx + m.w, HY);
    ctx.moveTo(mx + m.w * 0.25, HY - m.h * 0.5); ctx.lineTo(mx + m.w / 2, pico); ctx.lineTo(mx + m.w * 0.75, HY - m.h * 0.5);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(45,226,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(mx + m.w * 0.4, HY - m.h * 0.8); ctx.lineTo(mx + m.w * 0.55, HY);
    ctx.stroke();
  }

  for (const b of ciudad) {
    const bx = b.x - cam.x * 0.45;
    if (bx + b.w < 0 || bx > canvas.width) continue;
    const by = HY - b.h;
    ctx.fillStyle = '#131538';
    ctx.fillRect(bx, by, b.w, b.h);
    ctx.fillStyle = b.mag ? 'rgba(255,47,214,0.55)' : 'rgba(45,226,255,0.55)';
    const bi = Math.floor(b.x);
    for (let fy = by + 6; fy < HY - 6; fy += 11)
      for (let fx = bx + 5; fx < bx + b.w - 6; fx += 9)
        if (((bi + Math.floor(fx) * 3 + Math.floor(fy) * 7) % 5) < 2)
          ctx.fillRect(fx, fy, 3, 4);
    if (b.h > 90) {
      for (let k = 0; k < 4; k++) {
        const ly = by + 14 + (k * (b.h - 20)) / 4;
        const on = ((Math.floor(b.x) + k * 7 + Math.floor(tiempo * 3)) % 6) < 3;
        ctx.fillStyle = on ? 'rgba(57,255,20,0.75)' : 'rgba(57,255,20,0.15)';
        ctx.fillRect(bx + 4, ly, b.w - 10, 1.8);
      }
    }
  }

  ctx.lineWidth = 1;
  for (let k = -24; k <= 24; k++) {
    const xTop = canvas.width / 2 + (k * 80 - cam.x * 0.25);
    const xBot = canvas.width / 2 + (k * 80 - cam.x * 0.25) * 2.4;
    ctx.strokeStyle = 'rgba(45,226,255,0.16)';
    ctx.beginPath();
    ctx.moveTo(xTop, HY);
    ctx.lineTo(xBot, canvas.height);
    ctx.stroke();
  }
  const H = canvas.height - HY;
  for (let i = 0; i < 14; i++) {
    const u = ((i + tiempo * 1.6) % 14) / 14;
    const y = HY + H * Math.pow(u, 2.1);
    ctx.strokeStyle = `rgba(45,226,255,${0.08 + 0.28 * u})`;
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
  glowOn('#2de2ff', 10);
  ctx.strokeStyle = 'rgba(45,226,255,0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, HY); ctx.lineTo(canvas.width, HY);
  ctx.stroke();
  glowOff();
}

// 🪞 REFLEJO de la ciudad bajo el grid — 2 drawImage total, casi gratis (v14.2)
function dibujarReflejo() {
  const HY = 330 - cam.y * 0.25;          // misma línea de horizonte del fondo
  const altoOrigen = 140;                  // franja de cielo+ciudad que se refleja
  const altoReflejo = 110;                 // cuánto del grid cubre el reflejo

  // 1) copiar la franja superior (ciudad) al espejo, invertida verticalmente
  esCtx.save();
  esCtx.clearRect(0, 0, espejo.width, espejo.height);
  esCtx.translate(0, altoOrigen);
  esCtx.scale(1, -1);
  esCtx.drawImage(canvas,
    0, HY - altoOrigen, canvas.width, altoOrigen,
    0, 0, canvas.width, altoOrigen);
  esCtx.restore();

  // 2) estamparla debajo del horizonte, comprimida y con alpha
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.drawImage(espejo,
    0, 0, canvas.width, altoOrigen,
    0, HY + 1, canvas.width, altoReflejo);
  // 3) velo que desvanece el reflejo hacia abajo
  const velo = ctx.createLinearGradient(0, HY, 0, HY + altoReflejo);
  velo.addColorStop(0, 'rgba(11,11,42,0.05)');
  velo.addColorStop(1, 'rgba(11,11,42,0.75)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = velo;
  ctx.fillRect(0, HY + 1, canvas.width, altoReflejo);
  ctx.restore();
}

function dibujarPierna(hx, hy, ang, largo, dir) {
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(ang);
  ctx.fillStyle = '#9aa3b5';
  ctx.fillRect(-2.5, 0, 5, largo - 4);
  const fx = dir > 0 ? -2.5 : -8.5;
  ctx.fillStyle = '#2e6bff';
  rrectPath(fx, largo - 5, 11, 6, 3); ctx.fill();
  ctx.fillStyle = '#eef2fa';
  ctx.fillRect(fx, largo - 0.5, 11, 2);
  ctx.restore();
}

function dibujarBrazo(sx, sy, ang, trasero) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(ang);
  ctx.fillStyle = trasero ? '#a8a294' : '#c4beb0';
  ctx.fillRect(-2.5, 0, 5, 9);
  ctx.fillStyle = trasero ? '#dcd7cc' : '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 12, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function dibujarCara(tipo, blink, dir) {
  const CY = '#e8fbff';
  const ox = dir * 2;
  const oj = -27;

  function ojoPixel(cx, cy) {
    ctx.fillStyle = CY;
    ctx.beginPath();
    ctx.moveTo(cx - 4, cy - 2); ctx.lineTo(cx - 2, cy - 4.5);
    ctx.lineTo(cx + 2, cy - 4.5); ctx.lineTo(cx + 4, cy - 2);
    ctx.lineTo(cx + 4, cy + 2); ctx.lineTo(cx + 2, cy + 4.5);
    ctx.lineTo(cx - 2, cy + 4.5); ctx.lineTo(cx - 4, cy + 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0d2a5e';
    ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);
  }
  function cejaSeria(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(cx < 0 ? 0.16 : -0.16);
    ctx.fillStyle = CY;
    ctx.fillRect(-4.5, -1.3, 9, 2.6);
    ctx.restore();
  }
  function bocaSeria() {
    ctx.fillStyle = CY;
    ctx.fillRect(-3.5 + ox, -16, 7, 2.2);
  }

  if (tipo === 'dano') {
    ctx.strokeStyle = CY; ctx.lineWidth = 2;
    for (const ex of [-7, 7]) {
      ctx.beginPath();
      ctx.moveTo(ex - 3, oj - 3); ctx.lineTo(ex + 3, oj + 3);
      ctx.moveTo(ex + 3, oj - 3); ctx.lineTo(ex - 3, oj + 3);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-6, -16); ctx.lineTo(-2, -18.5); ctx.lineTo(2, -16); ctx.lineTo(6, -18.5);
    ctx.stroke();
  } else if (tipo === 'run') {
    cejaSeria(-7 + ox, oj - 7); cejaSeria(7 + ox, oj - 7);
    ojoPixel(-7 + ox, oj); ojoPixel(7 + ox, oj);
    ctx.fillStyle = CY;
    ctx.fillRect(-4 + ox, -17, 8, 3.5);
    ctx.fillRect(-5.5 + ox, -13.5, 11, 2);
  } else if (tipo === 'salto') {
    ojoPixel(-7 + ox, oj); ojoPixel(7 + ox, oj);
    bocaSeria();
  } else if (tipo === 'caida') {
    ojoPixel(-7 + ox, oj); ojoPixel(7 + ox, oj);
    bocaSeria();
  } else if (tipo === 'duck') {
    ctx.fillStyle = CY;
    ctx.fillRect(-11 + ox, oj, 7, 2.2);
    ctx.fillRect(3 + ox, oj, 7, 2.2);
    bocaSeria();
  } else {
    if (blink) {
      ctx.fillStyle = CY;
      ctx.fillRect(-11 + ox, oj + 1, 8, 2);
      ctx.fillRect(3 + ox, oj + 1, 8, 2);
    } else {
      cejaSeria(-7 + ox, oj - 7); cejaSeria(7 + ox, oj - 7);
      ojoPixel(-7 + ox, oj); ojoPixel(7 + ox, oj);
    }
    bocaSeria();
  }
}

function dibujarJugador() {
  const cx = jugador.x + jugador.w / 2;
  const piesY = jugador.y + jugador.h;
  const dir = jugador.mirando;
  const vel = Math.abs(jugador.vx);
  const agachado = jugador.enSuelo && (teclas['ArrowDown'] || teclas['KeyS']) && jugador.dropTimer <= 0;
  const blink = jugador.enSuelo && vel < 200 && (tiempo % 3.4) < 0.14;

  let cara = 'idle';
  if (jugador.invuln > DURACION_INVULN - 0.55) cara = 'dano';
  else if (!jugador.enSuelo && jugador.coyoteTimer <= 0)
    cara = jugador.vy < -60 ? 'salto' : 'caida';
  else if (agachado) cara = 'duck';
  else if (vel > VEL_RUN_CARA) cara = 'run';

  ctx.save();
  ctx.translate(cx, piesY);

  let turnSquash = 1;
  if (jugador.turnTimer > 0) {
    const k = jugador.turnTimer / 0.16;
    turnSquash = 0.55 + 0.45 * Math.abs(2 * k - 1);
  }
  ctx.scale(jugador.escalaX * turnSquash, jugador.escalaY);

  let pA = 0, pB = 0, bA = 0.15, bB = -0.15, largoPierna = 13, cuelloY = -14;
  if (agachado) {
    pA = 0.55; pB = -0.55; largoPierna = 9; cuelloY = -7;
    bA = 0.55 * dir; bB = 0.55 * dir;
  } else if (!jugador.enSuelo && jugador.coyoteTimer <= 0) {
    pA = -0.7 * dir; pB = 0.7 * dir; largoPierna = 10;
    bA = -2.5 * dir; bB = -2.8 * dir;
  } else if (vel > VEL_RUN) {
    const amp = 0.35 + 0.55 * Math.min(1, vel / VEL_MAX);
    pA = Math.sin(jugador.fasePaso) * amp * dir;
    pB = Math.sin(jugador.fasePaso + Math.PI) * amp * dir;
    bA = -pA * 0.8; bB = -pB * 0.8;
  }
  // 🔫 brazo apunta según el último disparo (8 direcciones)
  if (jugador.bitTimer > BIT_CADENCIA - 0.1 && jugador.tienePistola) {
    const sA = Math.sin(jugador.bitAng);
    if (sA < -0.4) bA = -1.45 * dir;          // disparo hacia arriba: brazo levantado
    else if (sA > 0.4) bA = 0.9 * dir;        // disparo hacia abajo: brazo bajado
    else bA = -0.9 * dir;                     // frontal
  }

  if (dir > 0) {
    dibujarPierna(-6, -14, pB, largoPierna, dir);
    dibujarPierna(6, -14, pA, largoPierna, dir);
  } else {
    dibujarPierna(6, -14, pA, largoPierna, dir);
    dibujarPierna(-6, -14, pB, largoPierna, dir);
  }
  const homY = agachado ? -12 : cuelloY - 28;

  if (jugador.latigoT > 0) {
    ctx.save();
    ctx.translate(16 * dir, homY);
    ctx.rotate(jugador.latigoAng - Math.PI / 2 + 0.3);
    ctx.fillStyle = '#a8a294';
    ctx.fillRect(-2.5, 0, 5, 9);
    ctx.restore();
  } else {
    dibujarBrazo(16 * dir, homY, bB, true);
  }

  const bob = (cara === 'idle') ? Math.sin(tiempo * 2.5) * 1.2 : 0;
  ctx.save();
  ctx.translate(0, cuelloY + bob);
  const inclin = (vel > 10 && jugador.enSuelo) ? (vel / VEL_MAX) * 0.16 : 0;
  ctx.rotate(inclin * dir);
  if (agachado) ctx.scale(1.18, 0.62);

  fillRR(dir > 0 ? -26 : 21, -36, 5, 27, 1, '#b9b19d');
  ctx.fillStyle = '#8f887a';
  for (let i = 0; i < 3; i++) ctx.fillRect(dir > 0 ? -25 : 22, -33 + i * 5, 3, 2.5);
  fillRR(-21, -40, 42, 36, 5, '#e9e2d3');
  fillRR(-14, -5, 28, 5, 2, '#c9c1ad');
  glowOn('#39ff14', 5);
  ctx.fillStyle = '#39ff14';
  ctx.fillRect(dir > 0 ? 8 : -13, -3.5, 5, 2);
  glowOff();
  ctx.fillStyle = '#8f887a';
  for (let i = 0; i < 3; i++) ctx.fillRect(dir > 0 ? -18 : 13, -8, 4, 2);
  ctx.fillStyle = '#b9b19d';
  ctx.beginPath(); ctx.arc(dir * -2, -2.5, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(dir * 3, -2.5, 1.5, 0, Math.PI * 2); ctx.fill();

  fillRR(-15 + dir * 3.5, -37, 30, 27, 4, '#10254d');
  glowOn('#2196f3', 9);
  const pg = ctx.createLinearGradient(0, -37, 0, -10);
  pg.addColorStop(0, '#2a8af0');
  pg.addColorStop(1, '#0d3f9e');
  ctx.fillStyle = pg;
  rrectPath(-13 + dir * 3.5, -35, 26, 23, 3); ctx.fill();
  glowOff();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.beginPath();
  ctx.moveTo(-9 + dir * 3.5, -35);
  ctx.lineTo(-2 + dir * 3.5, -35);
  ctx.lineTo(-12 + dir * 3.5, -14);
  ctx.lineTo(-12 + dir * 3.5, -28);
  ctx.closePath();
  ctx.fill();

  dibujarCara(cara, blink, dir);
  ctx.restore();

  dibujarBrazo(-20 * dir, homY + bob, bA, false);
  ctx.restore();
}

function dibujarSombra() {
  let sueloY = null;
  const pies = jugador.y + jugador.h;
  for (const p of [...solidas, ...oneWays, ...bloquesQ]) {
    if (p.invisible) continue;
    if (jugador.x + jugador.w > p.x && jugador.x < p.x + p.w && p.y >= pies - 5) {
      if (sueloY === null || p.y < sueloY) sueloY = p.y;
    }
  }
  if (sueloY === null) return;
  const dist = sueloY - pies;
  const k = Math.max(0.2, 1 - dist / 380);
  ctx.fillStyle = `rgba(0,0,0,${0.35 * k})`;
  ctx.beginPath();
  ctx.ellipse(jugador.x + jugador.w / 2, sueloY - 2, 16 * k, 4 * k, 0, 0, Math.PI * 2);
  ctx.fill();
}

function dibujarCapacitor(c) {

  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + 10, top + c.h - 8); ctx.lineTo(x + 10, c.y + 6);
  ctx.moveTo(x + w - 10, top + c.h - 8); ctx.lineTo(x + w - 10, c.y + 6);
  ctx.stroke();
  const cg = ctx.createLinearGradient(x, 0, x + w, 0);
  cg.addColorStop(0, '#101b33');
  cg.addColorStop(0.35, '#1e2f55');
  cg.addColorStop(0.55, '#243a66');
  cg.addColorStop(1, '#0d1628');
  ctx.fillStyle = cg;
  rrectPath(x, top, w, c.h - 6, 7); ctx.fill();
  glowOn('#2de2ff', 7);
  ctx.strokeStyle = '#2de2ff';
  ctx.lineWidth = 1.6;
  rrectPath(x + 0.5, top + 0.5, w - 1, c.h - 7, 7); ctx.stroke();
  glowOff();
  ctx.fillStyle = 'rgba(207,214,228,0.85)';
  ctx.fillRect(x + 5, top + 6, 9, c.h - 18);
  ctx.fillStyle = '#101b33';
  for (let k = 0; k < 3 && top + 12 + k * 12 < c.y - 12; k++)
    ctx.fillRect(x + 6.5, top + 12 + k * 12, 6, 2.5);
  ctx.fillStyle = '#8f9ab0';
  ctx.fillRect(x + 3, top - 4, w - 6, 6);
  ctx.strokeStyle = '#5a6478';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + w / 2 - 7, top - 1); ctx.lineTo(x + w / 2 + 7, top - 1);
  ctx.moveTo(x + w / 2, top - 4); ctx.lineTo(x + w / 2, top + 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(125,249,255,0.75)';
  ctx.font = 'bold 8px monospace';
  ctx.fillText('470µF', x + 16, top + c.h / 2 + 3);
}

function dibujarVentilador(v) {
  const topFan = v.y - 90;
  fillRR(v.x, topFan, v.w, 90, 6, '#101a30');
  glowOn('#2de2ff', 9);
  ctx.strokeStyle = '#2de2ff';
  ctx.lineWidth = 2;
  rrectPath(v.x + 1, topFan + 1, v.w - 2, 88, 6); ctx.stroke();
  glowOff();
  ctx.fillStyle = '#5a6478';
  for (const [sx, sy] of [[v.x + 9, topFan + 9], [v.x + v.w - 9, topFan + 9], [v.x + 9, v.y - 9], [v.x + v.w - 9, v.y - 9]]) {
    ctx.beginPath(); ctx.arc(sx, sy, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  const cx = v.x + v.w / 2, cy = topFan + 45;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tiempo * 14);
  for (let i = 0; i < 4; i++) {
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = 'rgba(45,226,255,0.5)';
    ctx.beginPath();
    ctx.ellipse(0, -16, 9, 17, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  glowOn('#2de2ff', 8);
  ctx.fillStyle = '#0d2a5e';
  ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2de2ff';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.stroke();
  glowOff();
  glowOn('#39ff14', 5);
  ctx.fillStyle = '#39ff14';
  ctx.fillRect(v.x + v.w - 17, topFan + 7, 5, 2.5);
  glowOff();
  for (let i = 0; i < 8; i++) {
    const u = (tiempo * 0.45 + i / 8) % 1;
    const yy = (v.y - 90) - u * (v.altura - 90);
    const xx = v.x + 18 + (i % 4) * 28 + Math.sin(tiempo * 2 + i) * 4;
    const fade = Math.sin(u * Math.PI);
    ctx.globalAlpha = 0.35 * fade;
    ctx.strokeStyle = '#7df9ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(xx, yy);
    ctx.lineTo(xx, yy - 12);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ================================================================
//  🏗️ ARCOS DE HARDWARE + 🌊 RÍOS DE BINARIO
// ================================================================
function dibujarArcoHardware(a) {
  fillRR(a.x - a.r - 14, a.base - 90, 16, 90, 3, '#2a2545');
  fillRR(a.x + a.r - 2, a.base - 90, 16, 90, 3, '#2a2545');
  const n = 7;
  for (let i = 0; i < n; i++) {
    const t = Math.PI - (i / (n - 1)) * Math.PI;
    const cx = a.x + Math.cos(t) * a.r;
    const cy = a.base - 40 - Math.sin(t) * (a.r * 0.85);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((t - Math.PI / 2) * 0.5);
    if (i % 2 === 0) {
      fillRR(-15, -15, 30, 30, 3, '#3a3160');
      ctx.fillStyle = '#8f9ab0'; ctx.fillRect(-9, -12, 18, 9);
      glowOn('#ff2fd6', 5);
      ctx.strokeStyle = '#ff2fd6'; ctx.lineWidth = 1.2;
      rrectPath(-14, -14, 28, 28, 3); ctx.stroke();
      glowOff();
      ctx.fillStyle = '#e8e4d8'; ctx.fillRect(-8, 2, 16, 10);
    } else {
      glowOn('#2de2ff', 6);
      ctx.fillStyle = '#565e75';
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2de2ff'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.stroke();
      glowOff();
      ctx.fillStyle = '#101a30';
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  const cols = ['#ffd700', '#39ff14', '#2de2ff'];
  for (let c = 0; c < 3; c++) {
    const cx0 = a.x - a.r * 0.5 + c * a.r * 0.5;
    ctx.strokeStyle = cols[c]; ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(cx0, a.base - a.r * 0.9);
    ctx.quadraticCurveTo(cx0 + 20, a.base - a.r * 0.3, cx0 - 14, a.base - 8);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function dibujarRio(r) {
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x1, r.y, r.x2 - r.x1, 30); ctx.clip();
  ctx.fillStyle = '#041a3a';
  ctx.fillRect(r.x1, r.y, r.x2 - r.x1, 30);
  glowOn('#2de2ff', 6);
  ctx.strokeStyle = 'rgba(45,226,255,0.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(r.x1, r.y); ctx.lineTo(r.x2, r.y); ctx.stroke();
  glowOff();
  ctx.font = '10px monospace';
  const off = (tiempo * 60) % 30;
  for (let fila = 0; fila < 2; fila++) {
    ctx.fillStyle = fila ? 'rgba(125,249,255,0.5)' : 'rgba(45,226,255,0.8)';
    const yy = r.y + 11 + fila * 13;
    const desplaz = fila ? off : -off;
    const start = Math.floor(r.x1 / 14) * 14;
    for (let x = start; x < r.x2; x += 14) {
      const ch = ((Math.floor(x / 14) * 7 + fila * 5 + Math.floor(tiempo * 3)) % 2) ? '0' : '1';
      ctx.fillText(ch, x + desplaz, yy);
    }
  }
  ctx.restore();
}

function dibujarCyberBot(e) {

  }
  glowOn('#ff2fd6', 8);

  rrectPath(e.x, e.y + 6 + bob, e.w, e.h - 14, 5); ctx.fill();
  ctx.strokeStyle = '#ff2fd6';
  ctx.lineWidth = 1.5;

  glowOff();

  glowOff();
  ctx.fillStyle = '#1a0a14';
  ctx.beginPath(); ctx.arc(e.x + e.w / 2 + Math.sign(e.vx) * 1.8, e.y + 13 + bob, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#9aa3b5';
  ctx.lineWidth = 1.5;

  ctx.moveTo(e.x + e.w / 2, e.y + 6 + bob); ctx.lineTo(e.x + e.w / 2, e.y - 2 + bob);
